      const selIdx = selectedChains().map(chainIndex);
      const packs = items.map((it) => {
        const g = genericMatches(it);
        const names = [], codesByName = new Map();
        for (const i of g.idx) {
          const row = katalog.proizvodi[i];
          if (!selIdx.some((ci) => row[2][ci] != null)) continue;
          if (!codesByName.has(row[1])) { codesByName.set(row[1], []); names.push(row[1]); }
          codesByName.get(row[1]).push(row[0]);
        }
        return { it, names: names.slice(0, 220), codesByName };
      });
      for (let start = 0; start < packs.length; start += 5) {
        const batch = packs.slice(start, start + 5).filter((p) => p.names.length);
        if (!batch.length) continue;
        const body = batch.map((p, n) => `Stavka ${n + 1}: "${p.it.upit}"${p.it.znacenje ? ` (kupac misli: ${p.it.znacenje})` : ""}
${p.names.map((nm, j) => `${j + 1}. ${nm}`).join("\n")}`).join("\n\n");
        const b = await sample.json(`Za svaku stavku s popisa za kupnju dan je popis proizvoda iz cjenika. Odaberi SAMO proizvode koji su upravo ono što kupac želi kupiti.
Isključi: pribor i stvari koje samo spominju tu riječ (npr. "držač za ubrus", "krema za pelene"), proizvode za drugu namjenu (npr. "ubrusi za pod" kad kupac misli kuhinjske ubruse), drugu vrstu proizvoda (npr. sirni namaz kad kupac traži sir) i druge marke ako je kupac upisao marku.
Nazivi u cjenicima su često skraćeni (npr. "Posl.za pse pedigr.tasty 140 g" je Pedigree Tasty poslastica za pse), pa ih čitaj prema smislu.
Ako je kupac upisao točno određeni proizvod ili liniju (npr. "nivea length wonder regenerator"), prihvati samo taj proizvod u svim veličinama. Ako je upisao općenitu vrstu (npr. "banane", "posni sir"), prihvati sve marke, okuse i veličine pakiranja te vrste, ali ne druge proizvode koji je samo spominju (npr. za "banane" svježe banane, a ne čokoladne banane, sok ili kašicu od banane).
Vrati SAMO JSON polje: [{"stavka": broj, "proizvodi": [redni brojevi prihvaćenih proizvoda]}]

${body}`, { signal: ctl.signal });
        for (const r of Array.isArray(b) ? b : []) {
          const pk = batch[(r && r.stavka) - 1];
          if (!pk) continue;
          const okNames = new Set((Array.isArray(r.proizvodi) ? r.proizvodi : []).map((j) => pk.names[Number(j) - 1]).filter(Boolean));
          pk.it.prihvaceni = [...okNames].flatMap((nm) => pk.codesByName.get(nm));
          pk.it.odbijeni = pk.names.filter((nm) => !okNames.has(nm)).flatMap((nm) => pk.codesByName.get(nm));
          pk.it.provjereno = todayIso();
        }
      }
      for (const pk of packs) if (!pk.names.length) pk.it.provjereno = todayIso();
      classifying = null;
      commit(items.length > 1 ? "Provjereno: za svaku stavku biraju se samo proizvodi koji odgovaraju." : "Provjereno.");
    } catch (e) {
      const msg = {
        cancelled: "", not_granted: "Provjera nije dopuštena. Krive proizvode možeš maknuti s „nije to”.",
        rate_limited: "Previše zahtjeva u kratkom vremenu. Pokušaj za minutu.",
        invalid_json: "Provjera nije uspjela. Pokušaj ponovno.",
      }[e && e.code] ?? "Provjera nije uspjela. Pokušaj ponovno.";
      if (msg) toast(msg);
      if (items.some((it) => it.pojmovi)) { classifying = null; commit(); }
    } finally {
      classifying = null;
      render();
    }
  }
  function unchecked() { return state.stavke.filter((s) => s.upit && !s.provjereno); }

  function addItem(code) {
    const row = byCode.get(code);
    if (!row) return;
    if (addingAltFor) {
      const item = state.stavke.find((s) => s.id === addingAltFor);
      if (item && !item.kodovi.includes(code)) item.kodovi.push(code);
      addingAltFor = null; searchText = "";
      openItem = item ? item.id : null;
      commit("Zamjena je dodana.");
      return;
    }
    const existing = state.stavke.find((s) => (s.kodovi || []).includes(code));
    if (existing) { existing.kom += 1; commit(`Već je na popisu, sad ${existing.kom} kom.`); return; }
    state.stavke.push(newItem({ naziv: row[1], kodovi: [code] }));
    commit("Dodano na popis.");
  }

  function expiryDate(v) {
    const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
    if (v === "danas") return plusDays(0);
    if (v === "sutra") return plusDays(1);
    if (typeof v === "number" && v >= 0 && v < 400) return plusDays(Math.round(v));
    if (typeof v === "string" && /^\d+$/.test(v)) return plusDays(Math.min(399, parseInt(v, 10)));
    if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    return "";
  }

  // Dugu snimku zaslona izreži na dijelove koji se preklapaju, jer platforma svaku sliku
  // smanji na oko 1,2 megapiksela i tekst duge snimke postane nečitljiv.
  async function imageTiles(file) {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { return [file]; }
    const w = bmp.width, h = bmp.height;
    const scale = Math.min(1, 1080 / w);
    if (h <= w * 2.2 && scale === 1) { if (bmp.close) bmp.close(); return [file]; }
    const tileH = Math.round(w * 1.8), step = Math.round(w * 1.2);  // preklapanje 0,6 širine
    const tiles = [];
    for (let y = 0; y < h; y += step) {
      const sh = Math.min(tileH, h - y);
      if (tiles.length && sh < w * 0.6) break;  // ostatak je već u prethodnom dijelu
      const c = document.createElement("canvas");
      c.width = Math.round(w * scale); c.height = Math.round(sh * scale);
      c.getContext("2d").drawImage(bmp, 0, y, w, sh, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
      if (blob) tiles.push(blob);
      if (y + sh >= h) break;
    }
    if (bmp.close) bmp.close();
    return tiles.length ? tiles : [file];
  }

  async function readScreenshot(files) {
    if (!sample || !files.length) return;
    const code = $("#shot-chain").value;
    couponDraft = null;
    readingCoupon = { ctl: new AbortController(), done: 0, total: 1 };
    render();
    const tiles = [];
    for (const f of files) tiles.push(...(await imageTiles(f)));
    const batches = [];
    for (let i = 0; i < tiles.length; i += sampleMaxImages) batches.push(tiles.slice(i, i + sampleMaxImages));
    readingCoupon.total = batches.length;
    render();
    const prompt = `Na slikama ${tiles.length > 1 ? "su dijelovi snimki zaslona" : "je snimka zaslona"} aplikacije trgovine ${chainName(code)} (Hrvatska) s kuponima ili posebnim ponudama.${tiles.length > 1 ? " Dijelovi se preklapaju, pa se isti kupon može vidjeti na dvije slike: navedi ga samo jednom." : ""}
Pročitaj svaki kupon koji se vidi cijeli i vrati SAMO JSON polje objekata ovog oblika:
[{"naziv": "naziv proizvoda kako piše na kuponu", "trazi": "2 do 4 riječi za traženje proizvoda u cjeniku: vrsta proizvoda i marka ako se vidi na slici", "vrsta": "posto" | "cijena" | "xy" | "gratis", "vrijednost": broj, "x": broj, "y": broj, "istjece": "danas" | "sutra" | broj dana | "GGGG-MM-DD" | null, "povrat": true | false, "napomena": "npr. Samo za tebe ili U odabranim trgovinama, inače prazno"}]
Pravila:
- "posto": popust u postotku, vrijednost je postotak (npr. 40 za -40%).
- "cijena": posebna cijena po komadu u eurima, vrijednost je cijena (npr. 0.99).
- "xy": "kupi X plati Y" ili "X+1 gratis": x je koliko komada uzmeš, y koliko platiš (2+1 gratis je x=3, y=2). vrijednost stavi 0.
- "gratis": proizvod je besplatan. vrijednost stavi 0.
- istjece: "Istječe danas" je "danas", "Završava sutra" je "sutra", "6 dana do isteka" je 6, a ako piše datum, prepiši ga kao GGGG-MM-DD. Inače null.
- povrat: true ako kupon ne snižava cijenu na blagajni nego vraća novac kao bodove ili BONUS eure (npr. Konzumov „Kupon po tvom”). Inače false.
- Preskoči kupone odrezane na rubu slike.
Ako na slikama nema kupona, vrati [].`;
    try {
      const list = [];
      for (const batch of batches) {
        const out = await sample.json(prompt, { images: batch, signal: readingCoupon.ctl.signal });
        if (Array.isArray(out)) list.push(...out);
        readingCoupon.done += 1;
        if (readingCoupon.done < readingCoupon.total) render();
      }
      const seen = new Set();
      const couponKey = (lanac, naziv, vrsta, vrijednost, vrijediDo) => [lanac, fold(naziv || ""), vrsta, Number(vrijednost) || 0, vrijediDo || ""].join("|");
      const saved = new Set(state.kuponi.map((k) => couponKey(k.lanac, k.naziv, k.vrsta, k.vrijednost, k.vrijediDo)));
      couponDraft = list.filter((k) => k && typeof k === "object").map((k) => {
        const naziv = String(k.naziv || "").slice(0, 100);
        const kandidati = findAtChain(`${k.trazi || ""} ${naziv}`, code, 6).map((r) => r[0]);
        return {
          id: uid(), lanac: code, naziv, opis: String(k.napomena || "").slice(0, 100),
          vrsta: ["posto", "cijena", "xy", "gratis"].includes(k.vrsta) ? k.vrsta : "posto",
          vrijednost: Number(k.vrijednost) || 0, x: Number(k.x) || 0, y: Number(k.y) || 0,
          vrijediDo: expiryDate(k.istjece), povrat: k.povrat === true, kandidati, odabran: kandidati[0] || "", on: true, postoji: false,
        };
      }).filter((k) => k.vrsta === "gratis" || (k.vrsta === "xy" ? k.x > k.y && k.y >= 0 : k.vrijednost > 0 && (k.vrsta !== "posto" || k.vrijednost <= 100)))
        .filter((k) => {  // isti kupon s dva dijela koji se preklapaju
          const key = [fold(k.naziv), k.vrsta, k.vrijednost, k.x, k.y, k.vrijediDo].join("|");
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map((k) => {  // kupon koji je već spremljen ne dodaj opet
          const exists = saved.has(couponKey(k.lanac, k.naziv, k.vrsta, k.vrijednost, k.vrijediDo));
          return { ...k, postoji: exists, on: !exists };
        });
    } catch (e) {
      const msg = {
        cancelled: "", not_granted: "Čitanje snimke nije dopušteno. Kupon možeš dodati ručno.",
        rate_limited: "Previše zahtjeva u kratkom vremenu. Pokušaj za minutu.",
        image_rejected: "Ova slika se ne može pročitati. Probaj PNG ili JPG snimku zaslona.",
        invalid_json: "Kupone nisam uspio pročitati. Probaj jasniju snimku ili dodaj kupon ručno.",
      }[e && e.code] ?? "Čitanje snimke nije uspjelo. Kupon možeš dodati ručno.";
      if (msg) toast(msg);
      couponDraft = null;
    } finally {
      readingCoupon = null;
      render();
    }
  }

  document.addEventListener("click", (ev) => {
    const tabBtn = ev.target.closest("nav.tabs button");
    if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = id ? state.stavke.find((s) => s.id === id) : null;
    switch (act) {
      case "go": setTab(el.dataset.tab); break;
      case "add-generic": {
        const it = addGeneric(searchText);
        if (it) { searchText = ""; commit("Dodano na popis. Aplikacija bira najjeftiniju marku."); classify([it]); }
        else toast("To je već na popisu.");
        break;
      }
      case "bulk-add": {
        const text = ($("#bulk") || {}).value || bulkText;
        // Zarez dijeli proizvode, osim u brojevima ("1,5 l").
        const added = text.split(/\n|;|,(?!\d)/).map((x) => x.trim()).filter((x) => x.length >= 2).map((x) => addGeneric(x)).filter(Boolean);
        if (added.length) { bulkText = ""; commit(`Dodano na popis: ${added.length}.`); classify(added); }
        else toast("Upiši barem jedan proizvod koji još nije na popisu.");
        break;
      }
      case "classify-all": classify(unchecked()); break;
      case "pick":
        if (picking && picking.id === id) picking = null;
        else if (item) { openPicker(item); openItem = null; }
        else picking = null;
        render();
        break;
      case "pick-group": {
        const on = el.dataset.on === "1";
        el.closest(".pgroup").querySelectorAll("[data-pick]").forEach((cb) => {
          if (cb.closest(".prow").hidden) return;
          cb.checked = on;
          on ? picking.sel.add(cb.dataset.pick) : picking.sel.delete(cb.dataset.pick);
        });
        break;
      }
      case "pick-all": {
        document.querySelectorAll("[data-picker] [data-pick]").forEach((cb) => { cb.checked = false; picking.sel.delete(cb.dataset.pick); });
        break;
      }
      case "pick-save": {
        const it = picking && state.stavke.find((x) => x.id === picking.id);
        if (it) {
          const shown = pickerRows(it).map((r) => r[0]);
          it.prihvaceni = shown.filter((c) => picking.sel.has(c));
          it.odbijeni = shown.filter((c) => !picking.sel.has(c));
          it.iskljuceni = [];
          it.rucno = true;
          it.provjereno = todayIso();
          picking = null;
          commit(it.prihvaceni.length ? `Spremljeno: uspoređuje se ${it.prihvaceni.length} ${plural(it.prihvaceni.length, "proizvod", "proizvoda", "proizvoda")}.` : "Nijedan proizvod nije označen, pa stavka nema cijenu.");
        }
        break;
      }
      case "reclassify":
        if (item) { for (const k of ["pojmovi", "prihvaceni", "odbijeni", "znacenje", "provjereno", "rucno"]) delete item[k]; classify([item]); }
        break;
      case "stop-classify": classifying?.ctl.abort(); break;
      case "accept": {
        const nm = byCode.get(el.dataset.code)?.[1];
        if (item && nm) {
          const back = (item.odbijeni || []).filter((c) => byCode.get(c)?.[1] === nm);
          item.odbijeni = (item.odbijeni || []).filter((c) => !back.includes(c));
          item.prihvaceni = [...new Set([...(item.prihvaceni || []), ...back])];
          commit("Proizvod je vraćen u usporedbu.");
        }
        break;
      }
      case "exclude":
        if (item) { item.iskljuceni = [...new Set([...(item.iskljuceni || []), el.dataset.code])]; commit("Taj proizvod se više neće birati."); }
        break;
      case "unexclude":
        if (item) { item.iskljuceni = (item.iskljuceni || []).filter((c) => c !== el.dataset.code); commit("Proizvod je vraćen."); }
        break;
      case "store-list": {
        const code = el.dataset.chain;
        openStore = openStore === code && el.classList.contains("storebtn") ? null : code;
        render();
        const btn = openStore && document.querySelector(`.storebtn[data-chain="${openStore}"]`);
        if (btn) btn.scrollIntoView({ block: "start", behavior: "smooth" });
        break;
      }
      case "del-popust": state.popusti = (state.popusti || []).filter((d) => d.id !== id); commit("Popust je obrisan."); break;
      case "add": addItem(el.dataset.code); break;
      case "qty": if (item) { item.kom = Math.max(1, Math.min(99, item.kom + Number(el.dataset.d))); commit(); } break;
      case "toggle": openItem = openItem === id ? null : id; renaming = null; render(); break;
      case "alt": addingAltFor = id; searchText = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" }); $("#q")?.focus(); break;
      case "cancel-alt": addingAltFor = null; render(); break;
      case "rm-alt": if (item && item.kodovi.length > 1) { item.kodovi = item.kodovi.filter((k) => k !== el.dataset.code); commit("Maknuto iz stavke."); } break;
      case "rename": renaming = renaming === id ? null : id; render(); $(`#rename-${id}`)?.focus(); break;
      case "del":
        if (item) {
          lastRemoved = [item];
          state.stavke = state.stavke.filter((s) => s.id !== id);
          if (openItem === id) openItem = null;
          commit(`Obrisano: ${item.naziv}`, { label: "Vrati", act: "undo" });
        }
        break;
      case "del-all":
        // Drugi dodir u 4 sekunde potvrđuje; poslije se još može vratiti.
        if (el.dataset.confirm !== "1") {
          el.dataset.confirm = "1";
          el.classList.add("armed");
          el.textContent = `Obriši svih ${state.stavke.length}?`;
          setTimeout(() => { if (el.isConnected) { el.dataset.confirm = ""; el.classList.remove("armed"); el.textContent = "Obriši sve"; } }, 4000);
          return;
        }
        lastRemoved = state.stavke.slice();
        state.stavke = [];
        openItem = null;
        commit(`Popis je obrisan (${lastRemoved.length} ${plural(lastRemoved.length, "stavka", "stavke", "stavki")}).`, { label: "Vrati", act: "undo" });
        break;
      case "undo":
        if (lastRemoved && lastRemoved.length) {
          const have = new Set(state.stavke.map((s) => s.id));
          state.stavke = sortItems([...state.stavke, ...lastRemoved.filter((s) => !have.has(s.id))]);
          lastRemoved = null;
          $("#toast").hidden = true;
          commit("Vraćeno.");
        }
        break;
      case "del-coupon": state.kuponi = state.kuponi.filter((k) => k.id !== id); commit("Kupon je obrisan."); break;
      case "clear-examples":
        state.kuponi = state.kuponi.filter((k) => !k.primjer && !state.stavke.some((s) => s.primjer && s.id === k.stavka));
        state.stavke = state.stavke.filter((s) => !s.primjer);
        commit("Primjeri su obrisani.");
        break;
      case "stop-read": readingCoupon?.ctl.abort(); break;
      case "draft-cancel": couponDraft = null; render(); break;
      case "draft-save": {
        const chosen = (couponDraft || []).filter((k) => k.on);
        for (const k of chosen) {
          state.kuponi.push({ id: k.id, lanac: k.lanac, naziv: k.naziv, opis: k.opis, vrsta: k.vrsta, vrijednost: k.vrijednost, x: k.x, y: k.y, vrijediDo: k.vrijediDo, povrat: k.povrat || undefined, kodovi: k.odabran ? [k.odabran] : [], izvor: "snimka" });
        }
        couponDraft = null;
        commit(chosen.length ? `Spremljeno kupona: ${chosen.length}.` : "Nijedan kupon nije označen.");
        break;
      }
      case "coupon-add": {
        const k = state.kuponi.find((x) => x.id === id);
        const kodovi = k ? (k.kodovi || []).filter((c) => byCode.has(c)) : [];
        if (k && kodovi.length) {
          state.stavke.push(newItem({ naziv: (k.naziv || byCode.get(kodovi[0])[1]).slice(0, 80), kom: k.vrsta === "xy" ? k.x : 1, kodovi }));
          commit("Dodano na popis, kupon je uračunat.");
        }
        break;
      }
      case "del-expired": state.kuponi = state.kuponi.filter(couponActive); commit("Istekli kuponi su obrisani."); break;
    }
  });

  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "bulk") { bulkText = t.value; return; }
    if (t.id === "pick-filter") {
      const q = normText(t.value).split(/\s+/).filter(Boolean);
      document.querySelectorAll("[data-picker] .prow").forEach((row) => { row.hidden = !q.every((w) => row.dataset.name.includes(w)); });
      document.querySelectorAll("[data-picker] .pgroup").forEach((gr) => { gr.hidden = ![...gr.querySelectorAll(".prow")].some((r) => !r.hidden); });
      return;
    }
    if (t.id === "q") {
      searchText = t.value;
      clearTimeout(searchTimer);
      // Osvježi samo rezultate, da tipkovnica na mobitelu ostane otvorena.
      searchTimer = setTimeout(() => {
        const box = $("#results");
        if (box) box.innerHTML = searchText.trim().length >= 2 ? resultsHtml() : "";
      }, 150);
    }
  });
  let searchTimer = null;

  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.pick != null && picking) {
      t.checked ? picking.sel.add(t.dataset.pick) : picking.sel.delete(t.dataset.pick);
      return;
    }
    if (t.dataset.popust) {
      const d = (state.popusti || []).find((x) => x.id === t.dataset.popust);
      if (d) { d.ukljucen = t.checked; commit(t.checked ? `Popust ${d.naziv} je uračunat.` : `Popust ${d.naziv} se ne računa.`); }
      return;
    }
    if (t.dataset.card) {
      state.kartice = Object.assign({}, state.kartice, { [t.dataset.card]: t.checked });
      const name = cardPrices.get(t.dataset.card)?.naziv || "kartica";
      commit(t.checked ? `Cijene uz ${name} su uračunate.` : `Cijene uz ${name} se više ne računaju.`);
    } else if (t.dataset.chain) {
      const sel = new Set(selectedChains());
      t.checked ? sel.add(t.dataset.chain) : sel.delete(t.dataset.chain);
      state.trgovine = chains().map((c) => c.kod).filter((c) => sel.has(c));
      commit(t.checked ? `${chainName(t.dataset.chain)} je uključen.` : `${chainName(t.dataset.chain)} je isključen.`);
    } else if (t.id === "grad") {
      state.grad = t.value;
      commit(t.value ? `Grad je postavljen: ${t.value}.` : "Prikazuje se cijela Hrvatska.");
    } else if (t.id === "k-vrsta") {
      const v = t.value;
      $("#k-xy").hidden = v !== "xy";
      $("#k-val-wrap").hidden = v === "xy" || v === "gratis";
      const lab = $("#k-val-wrap label"), inp = $("#k-val");
      if (v === "posto") { lab.textContent = "Popust (%)"; inp.min = 1; inp.max = 100; inp.step = 1; inp.value = 50; }
      if (v === "cijena") { lab.textContent = "Cijena s kuponom (€)"; inp.min = 0.01; inp.removeAttribute("max"); inp.step = 0.01; inp.value = "0.99"; }
      inp.required = v === "posto" || v === "cijena";
    } else if (t.id === "shot" && t.files && t.files.length) {
      readScreenshot([...t.files]);
    } else if (t.dataset.draftOn != null) {
      couponDraft[+t.dataset.draftOn].on = t.checked;
    } else if (t.dataset.draftProd != null) {
      couponDraft[+t.dataset.draftProd].odabran = t.value;
    }
  });

  document.addEventListener("submit", (ev) => {
    const f = ev.target;
    ev.preventDefault();
    if (f.dataset.form === "coupon") {
      const vrsta = $("#k-vrsta").value;
      const k = { id: uid(), lanac: $("#k-lanac").value, stavka: $("#k-stavka").value, vrsta, vrijediDo: $("#k-do").value || "" };
      if ($("#k-povrat").checked) k.povrat = true;
      if (vrsta === "xy") {
        k.x = parseInt($("#k-x").value, 10); k.y = parseInt($("#k-y").value, 10); k.vrijednost = 0;
        if (!(k.x >= 2 && k.y >= 1 && k.y < k.x)) { toast("Broj komada koje platiš mora biti manji od broja koje uzmeš."); return; }
      } else if (vrsta === "gratis") {
        k.vrijednost = 0;
      } else {
        k.vrijednost = parseFloat(String($("#k-val").value).replace(",", "."));
        if (!(k.vrijednost > 0) || (vrsta === "posto" && k.vrijednost > 100)) { toast("Upiši ispravan iznos popusta."); return; }
      }
      state.kuponi.push(k);
      commit("Kupon je dodan i uračunat.");
    } else if (f.dataset.form === "rename") {
      const item = state.stavke.find((s) => s.id === f.dataset.id);
      const v = $(`#rename-${f.dataset.id}`).value.replace(/\s+/g, " ").trim().slice(0, 80);
      if (item && v) {
        if (item.upit) {
          item.upit = v; item.naziv = v[0].toUpperCase() + v.slice(1); item.iskljuceni = [];
          for (const k of ["pojmovi", "prihvaceni", "odbijeni", "znacenje", "provjereno"]) delete item[k];
          setTimeout(() => classify([item]), 0);
        }
        else item.naziv = v;
        renaming = null;
        commit(item.upit ? "Pretraga je promijenjena." : "Naziv je promijenjen.");
      }
    } else if (f.dataset.form === "popust") {
      const posto = parseInt($("#p-posto").value, 10);
      const naziv = $("#p-naziv").value.trim() || "Popust";
      if (!(posto >= 1 && posto <= 50)) { toast("Upiši popust između 1 i 50%."); return; }
      state.popusti = [...(state.popusti || []), { id: uid(), lanac: $("#p-lanac").value, naziv: naziv.slice(0, 40), posto,
        samoRedovne: $("#p-redovne").checked, napomena: $("#p-napomena").value.trim().slice(0, 60), ukljucen: true }];
      commit(`Popust ${naziv} je dodan i uračunat.`);
    }
  });

  function setTab(t) {
    tab = t; couponDraft = tab === "kuponi" ? couponDraft : null;
    try { localStorage.setItem(TAB_KEY, t); } catch (e) {}
    render();
    window.scrollTo({ top: 0 });
  }

  // ---------- Pokretanje ----------
  const local = loadLocal();
  if (local) state = Object.assign(defaultState(), local);
  try { const t = localStorage.getItem(TAB_KEY); if (t && ["plan", "popis", "kuponi", "trgovine"].includes(t)) tab = t; } catch (e) {}
  render();
  loadKatalog();
  connectDb();
  connectSample();
})();
</script>
