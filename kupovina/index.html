<title>Pametna košarica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Raspored: jedan stupac kao blagajnički račun, cijene u stilu žutih etiketa s police; kartice na dnu za palac. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17201b;
  --muted: #5d6a62;
  --line: #d9dfda;
  --tag: #ffd60a;
  --tag-ink: #1a1a12;
  --sale: #d1222b;
  --sale-soft: #fde8e8;
  --save: #18794e;
  --save-soft: #e2f3ea;
  --coupon: #6a3fb5;
  --coupon-soft: #efe8fa;
  --focus: #1d5fd1;
  --sale-strong: #d1222b;
  --pack: #8a5a00; --pack-soft: #fff4d6;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: 2.5rem;
  --radius: 10px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #1a201c; --ink: #e9efea; --muted: #9aa8a0; --line: #2d3631;
    --tag: #f2c500; --tag-ink: #16160f; --sale: #ff6b6b; --sale-soft: #3a1c1e;
    --save: #4fd18b; --save-soft: #16301f; --coupon: #b99af0; --coupon-soft: #2a2140; --focus: #7aa7ff;
    --sale-strong: #c92a2a; --pack: #ffd27a; --pack-soft: #3a2e0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #1a201c; --ink: #e9efea; --muted: #9aa8a0; --line: #2d3631;
  --tag: #f2c500; --tag-ink: #16160f; --sale: #ff6b6b; --sale-soft: #3a1c1e;
  --save: #4fd18b; --save-soft: #16301f; --coupon: #b99af0; --coupon-soft: #2a2140; --focus: #7aa7ff;
  --sale-strong: #c92a2a; --pack: #ffd27a; --pack-soft: #3a2e0a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 18px;
}
header.top { display: grid; gap: 2px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1; letter-spacing: 0.01em; text-wrap: balance; }
.brand span { background: var(--tag); color: var(--tag-ink); padding: 0 6px; border-radius: 4px; }
.sub { color: var(--muted); font-size: var(--step--1); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.num { font-variant-numeric: tabular-nums; }

/* Etiketa s cijenom */
.tag {
  display: inline-flex; align-items: baseline; gap: 2px;
  background: var(--tag); color: var(--tag-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1;
  padding: 4px 8px 3px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.tag.big { font-size: var(--step-3); padding: 6px 12px 4px; }
.tag.plain { background: transparent; color: var(--ink); padding-inline: 0; }
.old { color: var(--muted); text-decoration: line-through; font-size: var(--step--1); white-space: nowrap; }
.badge {
  display: inline-block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px; white-space: nowrap; line-height: 1.4;
}
.badge.sale { background: var(--sale-strong); color: #fff; }
.badge.pack { background: var(--pack-soft); color: var(--pack); border: 1px solid var(--pack); text-transform: none; letter-spacing: 0; font-size: 0.75rem; white-space: normal; }
.badge.sub { background: transparent; color: var(--focus); border: 1px solid var(--focus); }
.badge.manual { background: var(--bg); color: var(--ink); border: 1px solid var(--muted); }
.badge.coupon { background: var(--coupon-soft); color: var(--coupon); border: 1px dashed var(--coupon); }
.badge.example { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.badge.cardb { background: transparent; color: var(--sale); border: 1px solid var(--sale); }
.stores .cardrow { padding: 0 14px 12px 48px; margin-top: -4px; }
.stores .cardrow label { padding: 0; gap: 10px; font-size: var(--step--1); }
.stores .cardrow input[type="checkbox"] { width: 18px; height: 18px; }
.badge.onlist { background: var(--save-soft); color: var(--save); }
.badge.disc { background: var(--save-soft); color: var(--save); border: 1px solid var(--save); }
.storebtn { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; min-width: 0; }
.storebtn strong { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.storelist { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 2px; }
.storelist .lines { padding: 0; }
.bulk textarea { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 1.0625rem; resize: vertical; min-height: 84px; }
.discounts { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.discounts label { align-items: flex-start; }
.discounts input { width: 20px; height: 20px; accent-color: var(--save); flex: none; margin-top: 1px; }
.picker { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--bg); }
.picker input[type="search"] { width: 100%; border: 1.5px solid var(--muted); border-radius: 8px; padding: 9px 10px; background: var(--surface); }
.pgroup { display: grid; gap: 2px; }
.pgroup-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0 2px; border-top: 1px solid var(--line); }
.pgroup-head strong { flex: 1 1 auto; }
.prow { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 6px 0; cursor: pointer; }
.prow input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--save); }
.prow .pmeta { grid-column: 2; font-size: var(--step--1); color: var(--muted); }
.picker-actions { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 8px 0 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--muted); border-radius: 999px; padding: 9px 14px; background: var(--surface); font-weight: 600; font-size: var(--step--1); line-height: 1.3; min-height: 40px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.attr.on { background: var(--save); color: var(--surface); border-color: var(--save); }
.chip.done { background: var(--bg); color: var(--muted); border-style: dashed; }
.browse-panel { display: grid; gap: 10px; }
.browse-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.browse-tools input, .browse-tools select { border: 1.5px solid var(--muted); border-radius: 8px; padding: 9px 10px; background: var(--surface); min-width: 0; }
.onestore { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.badge.expired { background: transparent; color: var(--muted); border: 1px solid var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.wraptext { overflow-wrap: anywhere; }

/* Plan kupnje */
.summary { padding: 16px; display: grid; gap: 12px; }
.summary .total { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.summary .label { font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.savebar { background: var(--save-soft); color: var(--save); border-radius: 6px; padding: 8px 10px; font-weight: 600; font-size: 0.9375rem; }
.stop { padding: 0; overflow: hidden; }
.stop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px dashed var(--line); }
.stop-name { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; line-height: 1; }
.lines { list-style: none; margin: 0; padding: 4px 14px 10px; display: grid; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line:last-child { border-bottom: 0; }
.line .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; grid-column: 1 / -1; }
.line .price { text-align: right; display: grid; justify-items: end; gap: 2px; }
.compare { list-style: none; margin: 0; padding: 0; display: grid; }
.compare li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.compare li:last-child { border-bottom: 0; }
.compare .bar { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.compare .bar i { display: block; height: 100%; background: var(--muted); opacity: 0.45; border-radius: 3px; }
.compare li.best .bar i { background: var(--save); opacity: 1; }

/* Popis */
.item { padding: 12px 14px; display: grid; gap: 8px; }
.item + .item { border-top: 1px solid var(--line); }
.item-top { display: flex; gap: 10px; align-items: flex-start; }
.item-name { font-weight: 600; overflow-wrap: anywhere; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.qty button { background: transparent; border: 0; width: 44px; height: 40px; font-size: 1.25rem; font-weight: 600; }
.qty span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.iconbtn { flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 1.25rem; line-height: 1; display: grid; place-items: center; }
.iconbtn:hover { color: var(--sale); border-color: var(--sale); }
.btn.danger.armed { background: var(--sale); color: #fff; border-color: var(--sale); }
.prices { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.prices li { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dotted var(--line); }
.prices li.cheapest .store { font-weight: 700; }
.prices .what { font-size: var(--step--1); color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.prices .amt { text-align: right; display: grid; justify-items: end; }
.alts { display: grid; gap: 4px; }
.alt { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); }
.alt .grow { overflow-wrap: anywhere; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 9px 14px; font-weight: 600; min-height: 40px;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--sale); }
.btn.small { padding: 8px 12px; min-height: 40px; font-size: var(--step--1); }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--focus); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; display: inline-flex; align-items: center; text-align: left; }

.search { position: relative; }
.search input {
  width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 14px; background: var(--surface);
  font-size: 1.0625rem;
}
.results { list-style: none; margin: 0; padding: 0; display: grid; }
.result { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.result:last-child { border-bottom: 0; }
.result .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.result.unavailable .grow { color: var(--muted); }

.notice { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; }
.notice.example { border-style: dashed; }
.empty { padding: 22px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; }

/* Kuponi */
.coupon { position: relative; padding: 12px 14px; border: 2px dashed var(--coupon); border-radius: var(--radius); background: var(--coupon-soft); display: grid; gap: 6px; }
.coupon.is-expired { border-color: var(--line); background: var(--surface); opacity: 0.75; }
.coupon-value { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1; color: var(--coupon); }
.form { display: grid; gap: 10px; padding: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: var(--step--1); font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; border: 1.5px solid var(--muted); border-radius: 8px; padding: 9px 10px; background: var(--surface); min-height: 40px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }

/* Trgovine */
.stores { list-style: none; margin: 0; padding: 0; }
.stores li { border-bottom: 1px solid var(--line); }
.stores li:last-child { border-bottom: 0; }
.stores label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.stores input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--save); flex: none; }

/* Donja traka s karticama */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button {
  background: none; border: 0; height: var(--tabbar-h); display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: 0.75rem; font-weight: 600; color: var(--muted); position: relative;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button svg { padding: 2px 14px; box-sizing: content-box; border-radius: 999px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"] svg { background: var(--tag); color: var(--tag-ink); }
nav.tabs .count { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--sale); color: #fff; font-size: 0.625rem; border-radius: 999px; padding: 0 5px; line-height: 1.5; }

.toast {
  position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; z-index: 30;
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9375rem;
  max-width: 560px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.18);
  display: flex; align-items: center; gap: 14px;
}
.toast button { background: transparent; border: 0; color: var(--tag); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; white-space: nowrap; }
.skeleton { height: 14px; border-radius: 4px; background: var(--line); }
.loading { padding: 18px 16px; display: grid; gap: 10px; }
.status { font-size: var(--step--1); color: var(--muted); }
.status.warn { color: var(--sale); }
details.help summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details.help { padding: 12px 14px; }
details.help ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }

/* Revizija sučelja */
#view { display: grid; gap: 28px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 4px; display: grid; gap: 1px; justify-items: center; min-height: 52px; line-height: 1.15; }
.seg button .n { font-size: var(--step--1); color: var(--muted); font-weight: 600; }
.seg button .v { font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; font-variant-numeric: tabular-nums; }
.seg button .x { font-size: 0.6875rem; color: var(--sale); font-weight: 600; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"] .n, .seg button[aria-pressed="true"] .x { color: var(--bg); }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--save); color: var(--save); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 600; font-size: var(--step--1); cursor: pointer; }
.dchip input { width: 18px; height: 18px; accent-color: var(--save); margin: 0; }
.warn { border: 1.5px solid var(--sale); background: var(--sale-soft); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 4px; }
.warn ul { margin: 0; padding: 0; list-style: none; display: grid; }
.warn li { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; min-height: 40px; }
.stop-sub { padding: 0 14px 8px; margin-top: -4px; }
.line { grid-template-columns: auto 1fr auto; }
.line .tick { width: 22px; height: 22px; accent-color: var(--save); margin: 2px 0 0; align-self: start; }
.line .meta { grid-column: 2 / -1; }
.line .what-line { grid-column: 2 / -1; font-size: 0.9375rem; overflow-wrap: anywhere; }
.line .goto { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; min-height: 32px; overflow-wrap: anywhere; }
.line.done .goto, .line.done .what-line { text-decoration: line-through; color: var(--muted); }
.line.miss { grid-template-columns: 1fr auto; }
.lines .aisle { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.lines .aisle:first-child { padding-top: 6px; }
.compare li.partial { color: var(--muted); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 44px; font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; font-size: 1rem; color: var(--muted); }
details.fold[open] > summary::after { content: "▴"; }
.addbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.addbar input { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 14px; background: var(--surface); font-size: 1.0625rem; min-width: 0; }
.suggest { display: grid; gap: 8px; }
.gen-add { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; border: 2px dashed var(--save); background: var(--save-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; min-height: 52px; font-weight: 600; }
.gen-add small { display: block; font-weight: 500; color: var(--muted); }
.item { padding: 10px 6px 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: start; }
.item.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--tag); } to { background: transparent; } }
.item-main { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 2px; min-width: 0; color: inherit; }
.item-main .item-name { font-weight: 700; font-size: 1.0625rem; overflow-wrap: anywhere; }
.item-main .item-name::after { content: " ▾"; color: var(--muted); font-size: 0.8125rem; }
.item.open .item-main .item-name::after { content: " ▴"; }
.item-best { font-size: 0.9375rem; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.item-prod { font-size: var(--step--1); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-side { display: grid; justify-items: end; gap: 4px; }
.item-panel { grid-column: 1 / -1; display: grid; gap: 10px; padding: 8px 8px 4px 0; }
.prices li { grid-template-columns: 5.5rem 1fr auto; }

<script>
(() => {
  "use strict";

  // ---------- Konstante ----------
  const DOC_PATH = "kosarica/glavna";
  const LOCAL_KEY = "pametna-kosarica-v1";
  const TAB_KEY = "pametna-kosarica-tab";
  const MAX_RESULTS = 30;

  // ---------- Stanje ----------
  let katalog = null;          // {datum, grad, lanci, gradovi, proizvodi}
  let byCode = new Map();      // kod -> red iz kataloga
  let cardPrices = new Map();  // lanac -> [{naziv, svi, cijene: Map(kod -> [[centi, od, do], ...])}]
  let folded = null;           // nazivi bez dijakritika, za pretragu
  let katalogError = "";
  let state = defaultState();
  let tab = "plan";
  let openItem = null;         // id stavke čije su cijene otvorene
  let addingAltFor = null;     // id stavke kojoj se dodaje zamjena
  let searchText = "";
  let db = null, docRef = null, dbStatus = "local", dirty = false, saving = false, saveTimer = null;
  let couponDraft = null;      // prijedlozi kupona sa snimke zaslona
  let sample = null, sampleImages = false, sampleMaxImages = 1, readingCoupon = null;

  function defaultState() {
    return { verzija: 1, trgovine: null, grad: "", stavke: [], kuponi: [], popusti: [] };
  }

  // ---------- Pomoćne funkcije ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const normText = (s) => fold(s).replace(/(\d),(\d)/g, "$1.$2");  // "2,8" i "2.8" su isto
  const fold = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
  const eur = (cents) => (cents / 100).toLocaleString("hr-HR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  const uid = () => Math.random().toString(36).slice(2, 10);
  const todayIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}.`; };
  const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };

  function toast(msg, action) {
    const t = $("#toast");
    t.textContent = "";
    const span = document.createElement("span");
    span.textContent = msg;
    t.append(span);
    if (action) {
      const b = document.createElement("button");
      b.dataset.act = action.act;
      b.textContent = action.label;
      t.append(b);
    }
    t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.hidden = true; }, action ? 7000 : 2600);
  }

  function chains() { return katalog ? katalog.lanci : []; }
  function chainIndex(code) { return chains().findIndex((c) => c.kod === code); }
  function chainName(code) { const c = chains().find((x) => x.kod === code); return c ? c.naziv : code; }
  function selectedChains() {
    const all = chains().filter((c) => c.poslovnica > 0).map((c) => c.kod);
    if (!state.trgovine) return all;
    return all.filter((c) => state.trgovine.includes(c));
  }

  // Cijena proizvoda u lancu: {cijena, redovna|null} u centima, ili null.
  function hasCard(code) { return !state.kartice || state.kartice[code] !== false; }
  function priceOf(row, chainIdx) {
    const p = row[2][chainIdx];
    if (p == null) return null;
    const base = Array.isArray(p) ? { cijena: p[0], redovna: p[1] } : { cijena: p, redovna: null };
    const code = katalog.lanci[chainIdx].kod;
    const today = todayIso();
    let best = base;
    for (const src of cardPrices.get(code) || []) {
      if (!src.svi && !hasCard(code)) continue;
      // Razdoblja su [centi, od, do]; prazan datum znači da granica nije poznata.
      const c = (src.cijene.get(row[0]) || []).find(([price, from, to]) => (!from || from <= today) && (!to || to >= today));
      if (c && c[0] < best.cijena) best = { cijena: c[0], redovna: base.redovna || base.cijena, kartica: src.svi ? null : src.naziv + (c[3] === "kupon" ? " kupon" : "") };
    }
    return best;
  }

  // ---------- Kuponi ----------
  function couponActive(k) { return !k.vrijediDo || k.vrijediDo >= todayIso(); }
  function couponLabel(k) {
    if (k.vrsta === "posto") return `-${k.vrijednost}%`;
    if (k.vrsta === "cijena") return eur(Math.round(k.vrijednost * 100));
    if (k.vrsta === "xy") return `Kupi ${k.x}, plati ${k.y}`;
    if (k.vrsta === "gratis") return "Gratis";
    return "";
  }
  // Kuponi koji vrijede za proizvod (kod) u lancu: povezani s proizvodom iz cjenika ili sa stavkom popisa.
  function couponsFor(code, kod, item) {
    return state.kuponi.filter((k) => k.lanac === code && couponActive(k) && ((item && k.stavka === item.id) || (k.kodovi || []).includes(kod)));
  }
  // Stavke popisa za koje kupon vrijedi: vezan uz stavku, isti proizvod ili proizvod koji opća stavka uspoređuje.
  let codeIndex = null;
  function itemCovers(s, code) {
    if ((s.kodovi || []).includes(code)) return true;
    if (!s.upit || !byCode.has(code) || !katalog) return false;
    if (!codeIndex) codeIndex = new Map(katalog.proizvodi.map((r, i) => [r[0], i]));
    const i = codeIndex.get(code), g = genericMatches(s);
    if (!g.idxSet) g.idxSet = new Set(g.idx);
    return g.idxSet.has(i) && allowedFilter(s)(code, i);
  }
  function couponItems(k) {
    return state.stavke.filter((s) => s.id === k.stavka || (k.kodovi || []).some((c) => itemCovers(s, c)));
  }
  function couponOnList(k) { return couponItems(k).length > 0; }
  // Ukupno za količinu, s kuponom ako postoji.
  function totalWithCoupon(unit, qty, k) {
    if (!k) return unit * qty;
    if (k.vrsta === "gratis") return Math.max(0, qty - 1) * unit;
    if (k.vrsta === "posto") return Math.round(unit * qty * (100 - k.vrijednost) / 100);
    if (k.vrsta === "cijena") return Math.min(unit, Math.round(k.vrijednost * 100)) * qty;
    if (k.vrsta === "xy" && k.x > 0 && k.y >= 0 && k.y < k.x) {
      const groups = Math.floor(qty / k.x);
      return (qty - groups * (k.x - k.y)) * unit;
    }
    return unit * qty;
  }

  // ---------- Opće stavke ("posni sir", bilo koja marka) ----------
  // Količina iz naziva: "400 g", "1,5 l", "6x1L", "16/1" (role), "10 kom" -> {v, dim} u g, ml ili kom.
  function parseQty(name) {
    const t = fold(name).replace(/(\d),(\d)/g, "$1.$2");
    if (/\/\s*kg\b/.test(t)) return { v: 1000, dim: "g", vaga: true };  // na vagu, cijena po kilogramu
    let m = t.match(/\d+\s*l\s*,\s*(\d+)\s*r\b/);  // Eurospin "3S, 150 L, 10R": 10 rola po 150 listova
    if (m) return +m[1] > 0 ? { v: +m[1], dim: "kom" } : null;
    m = t.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|dl|cl|l)\b/);
    let n = 1, v, u;
    if (m) { n = +m[1]; v = +m[2]; u = m[3]; }
    else if ((m = t.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|dl|cl|l)\b/))) { v = +m[1]; u = m[2]; }
    else if ((m = t.match(/(\d+)\s*\/\s*1\b/)) || (m = t.match(/(\d+)\s*(?:kom|rola|role|rol|r)\b/))) return +m[1] > 0 ? { v: +m[1], dim: "kom" } : null;
    else return null;
    const f = { kg: [1000, "g"], g: [1, "g"], l: [1000, "ml"], dl: [100, "ml"], cl: [10, "ml"], ml: [1, "ml"] }[u];
    return v > 0 ? { v: n * v * f[0], dim: f[1] } : null;
  }
  function qtyText(q) {
    if (!q) return "";
    if (q.vaga) return "kg (na vagu)";
    if (q.dim === "kom") return `${q.v} kom`;
    const big = q.v >= 1000;
    const n = big ? q.v / 1000 : q.v;
    return `${String(Math.round(n * 100) / 100).replace(".", ",")} ${q.dim === "g" ? (big ? "kg" : "g") : (big ? "l" : "ml")}`;
  }
  // Riječi upita bez količine; kratke riječi ("sir") moraju biti cijele, duže se traže po korijenu.
  const PROVJERA_V = 2;  // verzija Claudeove provjere stavki; starije provjere se nude ponovno
  const FILLER = new Set(["za", "i", "s", "sa", "od", "na", "u", "ili", "the", "and", "of", "with", "for"]);
  // "7days" -> "7 days", da se poklopi s "7 Days kroasan" (samo jedna znamenka i barem tri slova,
  // pa količine poput "500g" i "3sl" ostaju kakve jesu).
  function splitDigits(t) { return t.replace(/(^|[^a-z0-9.,])(\d)([a-z]{3,})/g, "$1$2 $3"); }
  function queryWords(q) {
    return splitDigits(normText(q))
      .replace(/\d+(?:\.\d+)?\s*(?:kg|g|ml|dl|cl|l)\b|\d+\s*\/\s*1\b|\d+\s*kom\b/g, " ")
      .split(/[^a-z0-9.]+/).map((w) => w.replace(/^\.+|\.+$/g, ""))
      .filter((w) => (w.length >= 2 || /^\d$/.test(w)) && !FILLER.has(w));
  }
  const genericCache = new Map();
  // Pojmovi za pretragu: ono što je kupac upisao i nazivi koje trgovci koriste ("ubrus" -> "papirnati ručnik").
  function termsOf(item) { return [item.upit, ...(item.pojmovi || [])]; }
  // Koliko se riječ upita poklapa s nazivom: 1 = ista riječ ("banane" ~ "banana"), 0,6 = dulja izvedenica
  // ("bananko", "bananom"), 0 = nema. Riječ se uvijek mora poklapati od početka ("tasty" nije u "dentastix").
  function wordScorer(w) {
    if (w.length <= 3 || /\d/.test(w)) {
      const re = new RegExp(`(^|[^a-z0-9.])${w.replace(/\./g, "\\.")}($|[^a-z0-9])`);
      return (name) => (name.includes(w) && re.test(name) ? 1 : 0);
    }
    const stem = w.slice(0, Math.max(4, w.length - 2));
    // Kratice iz cjenika: "pap. ručnici", "Papir.ručnici", "kuh. role" odgovaraju riječima "papirnati", "kuhinjske".
    const head = w.slice(0, 3);
    const abbr = /(?<![a-z0-9])([a-z]{3,})\./g;
    const abbrScore = (name) => {
      if (!name.includes(".") || !name.includes(head)) return 0;
      for (const m of name.matchAll(abbr)) if (m[1].length < w.length && w.startsWith(m[1])) return 0.7;
      return 0;
    };
    return (name) => {
      if (!name.includes(stem)) return abbrScore(name);
      let best = 0;
      for (const m of name.matchAll(new RegExp(`(^|[^a-z0-9])(${stem}[a-z0-9]*)`, "g"))) {
        best = Math.max(best, m[2].length <= stem.length + 2 ? 1 : 0.3);
        if (best === 1) break;
      }
      return best;
    };
  }
  // Kandidati za opću stavku. Cjenici skraćuju nazive ("Posl.za pse pedigr.tasty 140 g" je "Pedigree Tasty
  // Minis"), pa ne moraju sve riječi biti u nazivu: od 3 i više riječi dovoljno je oko 60 %. Najbolji
  // pogoci idu prvi; bez provjere se uspoređuju samo oni iz najbolje skupine.
  function genericMatches(item) {
    const key = termsOf(item).join("|");
    if (genericCache.has(key)) return genericCache.get(key);
    ensureFolded();
    const terms = termsOf(item).map((t) => {
      const words = queryWords(t);
      const firstStem = words[0] && words[0].length > 3 ? words[0].slice(0, Math.max(4, words[0].length - 2)) : words[0] || "";
      return { scorers: words.map(wordScorer), firstStem, need: words.length <= 2 ? words.length : Math.ceil(words.length * 0.6) };
    }).filter((t) => t.scorers.length);
    const hits = [];
    for (let i = 0; i < folded.length; i++) {
      const name = folded[i];
      let best = -1;
      for (const t of terms) {
        let n = 0, sum = 0;
        for (const sc of t.scorers) { const v = sc(name); if (v) { n++; sum += v; } }
        if (n < t.need) continue;
        // Prednost: upisana vrsta proizvoda je prva ili druga riječ naziva (iza marke), npr. "Banana /kg",
        // "Dukat Mlijeko", a ne usputno spomenuta ("Voćna kaša jabuka i banana").
        const lead = t.firstStem && name.split(/[^a-z0-9]+/).filter(Boolean).slice(0, 2)
          .some((w) => w.startsWith(t.firstStem) && w.length <= t.firstStem.length + 2) ? 0.05 : 0;
        best = Math.max(best, sum / t.scorers.length + lead);
      }
      if (best >= 0) hits.push([best - name.length / 5000, i]);
    }
    hits.sort((a, b) => b[0] - a[0]);
    const kept = hits.slice(0, 1500);
    const idx = kept.map((h) => h[1]);
    const topScore = kept.length ? kept[0][0] : 0;
    const strict = new Set(kept.filter((h) => h[0] >= topScore - 0.1).map((h) => h[1]));
    const qByCode = new Map(idx.map((i) => [katalog.proizvodi[i][0], parseQty(katalog.proizvodi[i][1])]));
    const res = { idx, strict, qty: parseQty(item.upit), qByCode };
    genericCache.set(key, res);
    return res;
  }
  // Koji kandidati smiju u usporedbu. Nakon provjere samo oni koje je Claude prihvatio; bez provjere
  // izbacuje se očiti pribor ("držač za ubrus", "krema za pelene").
  const ACCESSORY = /(^|[^a-z])(drzac|nosac|stalak|dozator)/;
  function allowedFilter(item) {
    const skip = new Set(item.iskljuceni || []);
    if (item.prihvaceni) {
      const ok = new Set(item.prihvaceni);
      return (code) => ok.has(code) && !skip.has(code);
    }
    const g = genericMatches(item);
    const onlyStrict = g.strict.size > 0;
    const raw = normText(item.upit).split(/[^a-z0-9.]+/);
    const afterZa = new Set(raw.filter((w, n) => n > 0 && raw[n - 1] === "za"));
    const stems = queryWords(item.upit).filter((w) => w.length > 3 && !afterZa.has(w)).map((w) => w.slice(0, Math.max(4, w.length - 2)));
    const forThing = stems.map((st) => new RegExp(`(^|[^a-z])za\\s+[a-z]*${st}`));
    const wantsAccessory = ACCESSORY.test(normText(item.upit));
    return (code, i) => {
      if (skip.has(code) || (onlyStrict && !g.strict.has(i))) return false;
      const name = folded[i];
      if (!wantsAccessory && ACCESSORY.test(name)) return false;
      return !forThing.some((re) => re.test(name));
    };
  }
  // Pakiranje s kojim se uspoređuje: količina iz upita, inače najčešće pakiranje u odabranim trgovinama.
  function genericRef(item, g, selIdx) {
    if (g.qty) return { ...g.qty, tol: 0.05 };
    const dims = new Map(), counts = new Map();
    const allowed = allowedFilter(item);
    let weighed = 0, total = 0;
    for (const i of g.idx) {
      const row = katalog.proizvodi[i];
      if (!allowed(row[0], i) || !selIdx.some((ci) => row[2][ci] != null)) continue;
      const q = g.qByCode.get(row[0]);
      if (!q) continue;
      total++;
      if (q.vaga) { weighed++; continue; }
      dims.set(q.dim, (dims.get(q.dim) || 0) + 1);
      const k = `${q.dim}:${Number(q.v.toPrecision(2))}`;
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    // Ako se proizvod uglavnom prodaje na vagu (banane), uspoređuje se cijena po kg; inače pakiranja.
    if (weighed && weighed >= total * 0.8) return { v: 1000, dim: "g", tol: null, vaga: true };
    if (!dims.size) return null;
    const dim = [...dims.entries()].sort((a, b) => b[1] - a[1])[0][0];
    const top = [...counts.entries()].filter(([k]) => k.startsWith(dim + ":"))
      .sort((a, b) => b[1] - a[1] || parseFloat(a[0].split(":")[1]) - parseFloat(b[0].split(":")[1]))[0];
    return { v: parseFloat(top[0].split(":")[1]), dim, tol: null };
  }
  function fitsRef(q, ref) {
    if (!ref) return true;
    if (ref.vaga || (q && q.vaga)) return !!(q && q.vaga && ref.vaga);
    if (!q || q.dim !== ref.dim) return false;
    return ref.tol != null ? Math.abs(q.v - ref.v) <= ref.v * ref.tol : q.v >= ref.v * 0.75 && q.v <= ref.v * 1.35;
  }
  function billDiscounts(code) { return (state.popusti || []).filter((d) => d.ukljucen && d.lanac === code); }

  // Najbolja ponuda stavke u jednom lancu: najjeftiniji proizvod iz stavke (ili iz pretrage za opću
  // stavku), s kuponom, cijenom uz karticu i popustom na račun.
  function offerAt(item, code, ctx) {
    const idx = chainIndex(code);
    if (idx < 0) return null;
    let codes = item.kodovi || [], g = null, ref = null;
    if (item.upit) {
      g = genericMatches(item);
      ref = ctx && ctx.refs ? ctx.refs.get(item.id) : genericRef(item, g, selectedChains().map(chainIndex));
      const allowed = allowedFilter(item);
      codes = g.idx.filter((i) => allowed(katalog.proizvodi[i][0], i)).map((i) => katalog.proizvodi[i][0]);
    }
    const found = scanOffers(item, code, idx, codes, g, ref);
    if (found || !item.upit) return found;
    // Trgovina nema traženo (npr. marku koju ne drži): najjeftinija zamjena iste vrste.
    const sub = scanOffers(item, code, idx, substituteCodes(item), g, ref);
    return sub ? { ...sub, zamjena: true } : null;
  }
  // Zamjene: Claude ih predloži pri provjeri (druga marka iste vrste). Za stavku s ručno odabranim
  // proizvodima zamjene su i ostali proizvodi koje je provjera prihvatila.
  function substituteCodes(item) {
    const skip = new Set([...(item.iskljuceni || []), ...(item.prihvaceni || [])]);
    return (item.zamjene || []).filter((c) => !skip.has(c));
  }
  function scanOffers(item, code, idx, codes, g, ref) {
    const discounts = billDiscounts(code);
    let best = null, fallback = null, unsized = null;
    for (const kod of codes) {
      const row = byCode.get(kod);
      if (!row) continue;
      const p = priceOf(row, idx);
      if (!p) continue;
      const q = g ? g.qByCode.get(kod) || parseQty(row[1]) : null;
      const fits = !g || fitsRef(q, ref);
      const perUnit = q ? Math.round(p.cijena / q.v * (q.dim === "kom" ? 1 : 1000)) : null;
      for (const k of [null, ...couponsFor(code, kod, item)]) {
        const withCoupon = totalWithCoupon(p.cijena, item.kom, k);
        let total = withCoupon, popust = null;
        for (const d of discounts) {
          if (d.samoRedovne && (k || p.redovna || p.kartica)) continue;  // samo proizvodi koji nisu na sniženju
          const t = Math.round(withCoupon * (100 - d.posto) / 100);
          if (t < total) { total = t; popust = d; }
        }
        const offer = { lanac: code, kod, naziv: row[1], cijena: p.cijena, redovna: p.redovna, kartica: p.kartica, ukupno: total, kupon: k,
          bezKupona: p.cijena * item.kom, povrat: k && k.povrat ? p.cijena * item.kom - withCoupon : 0, popust,
          jedinicna: perUnit, jedinica: q ? (q.dim === "g" ? "kg" : q.dim === "ml" ? "l" : "kom") : "",
          vaga: !!(q && q.vaga), pak: q ? qtyText(q) : "", refPak: ref && !ref.vaga ? qtyText(ref) : "" };
        if (fits) {
          if (!best || total < best.ukupno) best = offer;
        } else if (q && ref && q.dim === ref.dim) {
          // Nema sličnog pakiranja: uzmi najbliže po veličini (16 rola, a ne 80 vlažnih maramica).
          const dist = Math.abs(Math.log(q.v / ref.v));
          if (!fallback || dist < fallback.dist - 1e-9 || (Math.abs(dist - fallback.dist) < 1e-9 && total < fallback.ukupno)) {
            fallback = { ...offer, drugoPakiranje: true, dist };
          }
        } else if (!q && (!unsized || total < unsized.ukupno)) {
          unsized = { ...offer, drugoPakiranje: true };  // cjenik ne navodi količinu
        }
      }
    }
    return best || fallback || unsized;
  }

  // Redoslijed ponuda: traženi proizvod, pa drugo pakiranje, pa zamjena; unutar toga cijena.
  const offerRank = (o) => (o.zamjena ? 2 : 0) + (o.drugoPakiranje ? 1 : 0);
  const byOffer = (a, b) => (offerRank(a) - offerRank(b)) || (a.ukupno - b.ukupno);

  function computePlan() {
    const sel = selectedChains();
    const selIdx = sel.map(chainIndex);
    const refs = new Map();
    for (const item of state.stavke) if (item.upit) refs.set(item.id, genericRef(item, genericMatches(item), selIdx));
    const ctx = { refs };
    const perItem = state.stavke.map((item) => {
      const offers = sel.map((c) => offerAt(item, c, ctx)).filter(Boolean).sort(byOffer);
      return { item, offers, sorted: offers.slice(), best: offers[0] || null };
    });
    // Kad je ista najniža cijena u više trgovina, biraj trgovinu u kojoj se ionako kupuje više stvari.
    const score = new Map();
    for (const r of perItem) {
      if (!r.best) continue;
      for (const o of r.offers) if (o.ukupno === r.best.ukupno && !offerRank(o)) score.set(o.lanac, (score.get(o.lanac) || 0) + 1);
    }
    for (const r of perItem) {
      if (!r.best) continue;
      const ties = r.offers.filter((o) => o.ukupno === r.best.ukupno && offerRank(o) === offerRank(r.best));
      r.best = ties.reduce((a, b) => ((score.get(b.lanac) || 0) > (score.get(a.lanac) || 0) ? b : a), ties[0]);
      r.offers = [r.best, ...r.offers.filter((o) => o !== r.best)];
    }
    const stops = new Map();
    let total = 0, missing = [];
    for (const r of perItem) {
      if (!r.best) { missing.push(r.item); continue; }
      total += r.best.ukupno;
      if (!stops.has(r.best.lanac)) stops.set(r.best.lanac, []);
      stops.get(r.best.lanac).push(r);
    }
    const single = sel.map((c) => {
      let sum = 0, have = 0, subs = 0;
      for (const r of perItem) {
        const o = r.offers.find((x) => x.lanac === c);
        if (o) { sum += o.ukupno; have++; if (o.zamjena) subs++; }
      }
      return { lanac: c, ukupno: sum, ima: have, nema: perItem.length - have, zamjena: subs };
    }).sort((a, b) => (a.nema - b.nema) || (a.ukupno - b.ukupno));
    return { perItem, stops, total, missing, single, refs };
  }

  // ---------- Spremanje ----------
  function loadLocal() {
    try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
  }
  // Postavke i kuponi su jedan dokument (kosarica/glavna), a svaka stavka popisa svoj dokument
  // (popis/<id>), da više ljudi može istodobno dodavati i brisati stavke bez prebrisivanja.
  const ITEMS_PATH = "popis";
  let itemsCol = null, syncReady = false, syncedItems = new Map(), syncedMain = null;
  let lastItemsSnap = null, lastMainSnap = null;
  const stable = (v) => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x)
    ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))) : x));
  const plain = (v) => JSON.parse(JSON.stringify(v));
  function mainPart() { const { stavke, ...rest } = state; return plain(rest); }
  function sortItems(list) { return list.sort((a, b) => (a.vrijeme || 0) - (b.vrijeme || 0) || String(a.id).localeCompare(String(b.id))); }
  function itemsFrom(snap) { return sortItems(snap.docs.filter((d) => d.exists).map((d) => ({ ...plain(d.data()), id: d.id }))); }

  function commit(msg, action) {
    dirty = true;
    saveLocal();
    render();
    if (msg) toast(msg, action);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }
  async function flush() {
    if (!docRef || !syncReady || saving) return;
    saving = true;
    try {
      while (dirty) {
        dirty = false;
        const wanted = new Map(state.stavke.map((it) => [it.id, plain(it)]));
        for (const [id, obj] of wanted) {
          const json = stable(obj);
          if (syncedItems.get(id) !== json) { await itemsCol.doc(id).set(obj); syncedItems.set(id, json); }
        }
        for (const id of [...syncedItems.keys()]) {
          if (!wanted.has(id)) { await itemsCol.doc(id).delete(); syncedItems.delete(id); }
        }
        const main = mainPart(), mainJson = stable(main);
        if (mainJson !== syncedMain) { await docRef.set(main); syncedMain = mainJson; }
      }
      setDbStatus("saved");
    } catch (e) {
      setDbStatus(e && e.code === "invalid_argument" ? "readonly" : "error");
    } finally {
      saving = false;
      // Promjene drugih koje su stigle dok smo spremali.
      if (lastMainSnap) applyMainSnap(lastMainSnap);
      if (lastItemsSnap) applyItemsSnap(lastItemsSnap);
    }
  }
  function applyItemsSnap(snap) {
    lastItemsSnap = snap;
    if (dirty || saving) return;
    const remote = itemsFrom(snap);
    syncedItems = new Map(remote.map((it) => [it.id, stable(it)]));
    if (stable(remote) !== stable(state.stavke)) { state.stavke = remote; saveLocal(); render(); }
  }
  function applyMainSnap(snap) {
    lastMainSnap = snap;
    if (dirty || saving || !snap.exists) return;
    const data = plain(snap.data());
    delete data.stavke;
    syncedMain = stable(data);
    if (syncedMain !== stable(mainPart())) { state = Object.assign(defaultState(), data, { stavke: state.stavke }); saveLocal(); render(); }
  }

  function setDbStatus(s) { dbStatus = s; const el = $("#savestate"); if (el) el.replaceWith(saveStateEl()); }
  function saveStateEl() {
    const span = document.createElement("span");
    span.id = "savestate";
    const map = {
      local: "Spremljeno na ovom uređaju.",
      connecting: "Povezujem spremanje…",
      saved: "Popis je spremljen i vidiš ga na svakom uređaju.",
      slow: "Spremanje se još ne javlja. Promjene se zasad čuvaju na ovom uređaju.",
      error: "Spremanje trenutno ne radi. Promjene se zasad čuvaju na ovom uređaju.",
      readonly: "Ovaj popis možeš samo gledati. Za upisivanje te vlasnik treba pozvati s pravom uređivanja.",
    };
    span.textContent = map[dbStatus] || "";
    span.className = "status" + (dbStatus === "error" || dbStatus === "slow" ? " warn" : "");
    return span;
  }

  async function connectDb() {
    if (!window.claude || typeof window.claude.use !== "function") { setDbStatus("local"); return; }
    setDbStatus("connecting");
    const slowTimer = setTimeout(() => setDbStatus("slow"), 10000);
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { clearTimeout(slowTimer); setDbStatus("local"); return; }
    connectUser();
    docRef = db.doc(DOC_PATH);
    itemsCol = db.collection(ITEMS_PATH);
    let mainSnap = null, itemsSnap = null;
    const settle = () => {
      if (syncReady || !mainSnap || !itemsSnap) return;
      syncReady = true;
      clearTimeout(slowTimer);
      if (dbStatus !== "error") setDbStatus("saved");
      const data = mainSnap.exists ? plain(mainSnap.data()) : null;
      const legacy = data && Array.isArray(data.stavke) ? data.stavke : null;
      const remote = itemsFrom(itemsSnap);
      syncedItems = new Map(remote.map((it) => [it.id, stable(it)]));
      if (data) {
        delete data.stavke;
        state = Object.assign(defaultState(), data, { stavke: state.stavke });
        syncedMain = legacy ? null : stable(data);   // stari oblik: dokument treba prepisati bez stavki
      }
      if (!remote.length && (legacy || !data)) {
        // Prvi put u novom obliku: stavke iz starog dokumenta (ili s ovog uređaja) postaju zasebni zapisi.
        const t0 = Date.now();
        state.stavke = (legacy || state.stavke).map((it, n) => ({ ...it, vrijeme: it.vrijeme || t0 + n }));
        if (state.stavke.length || !data || legacy) dirty = true;
      } else {
        state.stavke = remote;
        if (!data || legacy) dirty = true;
      }
      saveLocal();
      render();
      if (dirty) flush();
    };
    const onErr = () => { clearTimeout(slowTimer); setDbStatus("error"); };
    docRef.onSnapshot((snap) => {
      if (!syncReady) { if (!snap.metadata.fromCache) { mainSnap = snap; settle(); } return; }
      applyMainSnap(snap);
    }, onErr);
    itemsCol.onSnapshot((snap) => {
      if (!syncReady) { if (!snap.metadata.fromCache) { itemsSnap = snap; settle(); } return; }
      applyItemsSnap(snap);
    }, onErr);
  }

  // Tko je dodao stavku (na zajedničkom popisu). Spremaju se samo id-jevi, imena se čitaju pri prikazu.
  let userCap = null, myId = null;
  const people = {};
  async function connectUser() {
    try { userCap = await window.claude.use("user"); } catch (e) { userCap = null; }
    if (!userCap) return;
    try { myId = await userCap.id(); } catch (e) { myId = null; }
    render();
  }
  async function refreshPeople() {
    if (!userCap) return;
    const ids = [...new Set(state.stavke.map((it) => it.dodao).filter((x) => x && x !== myId))];
    if (!ids.length) return;
    let ps = {};
    try { ps = await userCap.profiles(ids); } catch (e) { return; }
    let changed = false;
    for (const id of ids) {
      const nm = (ps[id] && ps[id].name) || "";
      if (people[id] !== nm) { people[id] = nm; changed = true; }
    }
    if (changed) render();
  }
  function newItem(fields) { return { id: uid(), kom: 1, vrijeme: Date.now(), ...(myId ? { dodao: myId } : {}), ...fields }; }

  async function connectSample() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try { sample = await window.claude.use("sample"); } catch (e) { sample = null; }
    if (!sample) return;
    try {
      const lim = await sample.limits();
      sampleImages = !!(lim && lim.images);
      sampleMaxImages = Math.max(1, Math.min(6, (lim && lim.images && lim.images.maxCount) || 1));
    } catch (e) { sampleImages = false; }
    if (tab === "kuponi" || tab === "popis") render();
  }

  // ---------- Katalog ----------
  async function loadKatalog() {
    try {
      const res = await fetch("katalog.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("http " + res.status);
      let text;
      const buf = await res.arrayBuffer();
      const bytes = new Uint8Array(buf);
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
        if (typeof DecompressionStream === "undefined") throw new Error("nogzip");
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder().decode(bytes);   // poslužitelj ga je već raspakirao
      }
      katalog = JSON.parse(text);
      byCode = new Map(katalog.proizvodi.map((r) => [r[0], r]));
      cardPrices = new Map();
      for (const k of katalog.kartice || []) {
        if (!cardPrices.has(k.lanac)) cardPrices.set(k.lanac, []);
        cardPrices.get(k.lanac).push({ naziv: k.naziv, svi: !!k.svi, cijene: new Map(Object.entries(k.cijene || {})) });
      }
      const label = katalog.grad ? `poslovnice u gradu ${katalog.grad}` : "cijela Hrvatska";
      $("#dataline").textContent = `Cijene iz službenih cjenika od ${fmtDate(katalog.datum)} · ${label}`;
    } catch (e) {
      katalogError = e && e.message === "nogzip"
        ? "Ovaj preglednik je prestar za učitavanje cijena. Otvori stranicu u novijem pregledniku."
        : "Cijene se nisu učitale. Provjeri internetsku vezu i otvori stranicu ponovno.";
      $("#dataline").textContent = katalogError;
    }
    render();
  }
  function ensureFolded() {
    if (!folded && katalog) folded = katalog.proizvodi.map((r) => splitDigits(normText(r[1])));
  }
  function search(q) {
    ensureFolded();
    const toks = normText(q).split(/\s+/).filter(Boolean);
    if (!toks.length || !folded) return [];
    const sel = selectedChains().map(chainIndex);
    const out = [];
    for (let i = 0; i < folded.length && out.length < 400; i++) {
      if (toks.every((t) => folded[i].includes(t))) out.push(i);
    }
    const score = (i) => {
      const r = katalog.proizvodi[i];
      const inSel = sel.filter((ix) => r[2][ix] != null).length;
      const starts = folded[i].startsWith(toks[0]) ? 1 : 0;
      return inSel * 10 + starts * 3 - r[1].length / 100;
    };
    return out.map((i) => [score(i), katalog.proizvodi[i]]).sort((a, b) => b[0] - a[0]).slice(0, MAX_RESULTS).map((x) => x[1]);
  }
  function cheapestSelected(row) {
    let best = null;
    for (const code of selectedChains()) {
      const p = priceOf(row, chainIndex(code));
      if (!p) continue;
      let price = p.cijena, kupon = null;
      for (const k of couponsFor(code, row[0], null)) {
        const t = totalWithCoupon(p.cijena, 1, k);
        if (t < price) { price = t; kupon = k; }
      }
      if (!best || price < best.cijena) best = { ...p, cijena: price, kupon, lanac: code };
    }
    return best;
  }
  // Proizvodi jednog lanca koji najbolje odgovaraju tekstu s kupona.
  function findAtChain(text, code, limit) {
    ensureFolded();
    const idx = chainIndex(code);
    const toks = [...new Set(fold(text).split(/[^a-z0-9]+/).filter((t) => t.length >= 2))];
    if (!toks.length || idx < 0) return [];
    const hits = [];
    for (let i = 0; i < folded.length; i++) {
      if (katalog.proizvodi[i][2][idx] == null) continue;
      const score = toks.reduce((sum, t) => sum + (folded[i].includes(t) ? t.length : 0), 0);
      if (score > 0) hits.push([score, i]);
    }
    hits.sort((a, b) => b[0] - a[0] || folded[a[1]].length - folded[b[1]].length);
    return hits.slice(0, limit).map((h) => katalog.proizvodi[h[1]]);
  }

  // ---------- Prikaz ----------
  try { if (localStorage.getItem("pk-debug")) window.__kosarica = { genericMatches, genericRef, allowedFilter, offerAt, computePlan, katalog: () => katalog, state: () => state, selectedChains, chainIndex }; } catch (e) {}
  function render() {
    refreshPeople();
    document.querySelectorAll("nav.tabs button").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    });
    const kuponBtn = document.querySelector('nav.tabs button[data-tab="kuponi"]');
    const active = state.kuponi.filter((k) => couponActive(k) && couponOnList(k)).length;
    kuponBtn.querySelector(".count")?.remove();
    if (active) kuponBtn.insertAdjacentHTML("beforeend", `<span class="count num">${active}</span>`);

    const view = $("#view");
    if (!katalog && !katalogError) { view.innerHTML = loadingHtml(); return; }
    if (katalogError) { view.innerHTML = `<div class="notice"><p>${esc(katalogError)}</p></div>`; return; }
    const html = { plan: planHtml, popis: popisHtml, kuponi: kuponiHtml, trgovine: trgovineHtml }[tab]();
    const focusId = document.activeElement && document.activeElement.id;
    const selStart = document.activeElement && document.activeElement.selectionStart;
    view.innerHTML = html;
    const status = $("#savestate-slot");
    if (status) status.replaceWith(saveStateEl());
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (selStart != null && el.setSelectionRange) try { el.setSelectionRange(selStart, selStart); } catch (e) {} }
    }
    if (flashId) {
      const el = document.querySelector(`[data-item="${flashId}"]`);
      flashId = null;
      if (el) { el.classList.add("flash"); el.scrollIntoView({ block: "center" }); }
    }
    if (afterRender) { const f = afterRender; afterRender = null; f(); }
  }

  function loadingHtml() {
    return `<div class="card loading" aria-busy="true">
      <p class="muted small">Učitavam cijene iz 8 trgovačkih lanaca…</p>
      <div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:55%"></div><div class="skeleton" style="width:62%"></div>
    </div>`;
  }

  function exampleNotice() {
    if (!state.stavke.some((s) => s.primjer) && !state.kuponi.some((k) => k.primjer)) return "";
    return `<div class="notice example">
      <p><span class="badge example">Primjer</span> Proizvodi i kupon označeni kao primjer su tu da vidiš kako aplikacija radi. Cijene su stvarne, a kupon je izmišljen.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn small" data-act="clear-examples">Obriši primjere</button><button class="btn small ghost" data-act="go" data-tab="popis">Dodaj svoje proizvode</button></div>
    </div>`;
  }

  function priceTag(cents, big, perKg) { return `<span class="tag${big ? " big" : ""}">${esc(eur(cents))}${perKg ? "/kg" : ""}</span>`; }

  function offerBadges(o) {
    let b = "";
    if (o.kupon) b += `<span class="badge coupon">Kupon ${esc(couponLabel(o.kupon))}${o.kupon.povrat ? " povrat" : ""}</span>`;
    if (o.kartica) b += `<span class="badge cardb">Uz ${esc(o.kartica)}</span>`;
    else if (o.redovna) b += `<span class="badge sale">Akcija</span>`;
    if (o.popust) b += `<span class="badge disc">−${o.popust.posto}% ${esc(o.popust.naziv)}</span>`;
    if (o.zamjena) b += `<span class="badge sub">Zamjena</span>`;
    if (o.drugoPakiranje) b += `<span class="badge pack">${esc(packText(o))}</span>`;
    return b;
  }
  function packText(o) {
    if (!o.pak) return "Pakiranje nije navedeno";
    return `Drugo pakiranje: ${o.vaga ? "na vagu" : o.pak}${o.refPak ? ` (ostale oko ${o.refPak})` : ""}`;
  }
  function unitNote(o) { return o && o.jedinicna ? `${eur(o.jedinicna)}/${o.jedinica}` : ""; }
  function qtyNote(item, o) { return o && o.vaga ? `${item.kom} kg × ${eur(o.cijena)}` : `${item.kom} × ${eur(o.cijena)}`; }

  function discountsHtml() {
    const list = state.popusti || [];
    if (!list.length) return "";
    return `<div class="dchips">${list.map((d) => `<label class="dchip" for="pop-${d.id}">
      <input id="pop-${d.id}" type="checkbox" data-popust="${d.id}" ${d.ukljucen ? "checked" : ""}>
      −${d.posto}% ${esc(d.naziv)} · ${esc(chainName(d.lanac))}</label>`).join("")}</div>`;
  }

  // ---------- U koliko trgovina ----------
  const PLAN_KEY = "pk-plan", BOUGHT_KEY = "pk-kupljeno";
  const readPref = (key, dflt) => { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? dflt : v; } catch (e) { return dflt; } };
  const savePref = (key, v) => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} };
  let planPick = readPref(PLAN_KEY, null);          // {n: 1|2|3|"sve"} ili {n: 1, store}
  let bought = new Set(readPref(BOUGHT_KEY, []));   // stavke označene kao kupljene (samo na ovom uređaju)
  let compareOpen = false;

  // Najbolji izbor za svaku stavku kad se kupuje samo u trgovinama iz skupa `set`.
  function planFor(plan, set) {
    let total = 0, missing = 0, subs = 0;
    const rows = plan.perItem.map((r) => {
      const o = r.sorted.find((x) => set.has(x.lanac)) || null;
      if (!o) missing++;
      else { total += o.ukupno; if (o.zamjena) subs++; }
      return { item: r.item, best: o, anywhere: r.sorted[0] || null, offers: r.sorted };
    });
    return { set, rows, total, missing, subs };
  }
  const planScore = (a, b) => a.missing - b.missing || a.subs - b.subs || a.total - b.total;
  function combos(list, k, start = 0, cur = [], out = []) {
    if (cur.length === k) { out.push(cur.slice()); return out; }
    for (let i = start; i < list.length; i++) { cur.push(list[i]); combos(list, k, i + 1, cur, out); cur.pop(); }
    return out;
  }
  // Mogućnosti: najjeftinije u 1, 2 ili 3 trgovine i najjeftinije za svaki proizvod posebno ("sve").
  function planOptions(plan) {
    const sel = selectedChains();
    const all = { n: "sve", ...planFor(plan, new Set(sel)) };
    all.rows = plan.perItem.map((r) => ({ item: r.item, best: r.best, anywhere: r.sorted[0] || null, offers: r.sorted }));
    all.set = new Set(plan.perItem.filter((r) => r.best).map((r) => r.best.lanac));
    const opts = [];
    for (const k of [1, 2, 3]) {
      if (k > sel.length || k >= all.set.size) break;
      let best = null;
      for (const c of combos(sel, k)) { const p = planFor(plan, new Set(c)); if (!best || planScore(p, best) < 0) best = p; }
      opts.push({ n: k, ...best });
    }
    opts.push(all);
    return opts;
  }
  function chosenPlan(plan, opts) {
    if (planPick && planPick.store && selectedChains().includes(planPick.store)) {
      return { n: 1, store: planPick.store, ...planFor(plan, new Set([planPick.store])) };
    }
    if (planPick && planPick.n != null) { const o = opts.find((x) => x.n === planPick.n); if (o) return o; }
    // Bez izbora: najmanje trgovina, a da je ukupno najviše 2 € (ili 5 %) skuplje od najjeftinijeg.
    const all = opts[opts.length - 1];
    const slack = Math.max(200, Math.round(all.total * 0.05));
    return opts.find((o) => o.missing === all.missing && o.subs === all.subs && o.total - all.total <= slack) || all;
  }
  function stopsOf(rows) {
    const m = new Map();
    for (const r of rows) {
      if (!r.best) continue;
      if (!m.has(r.best.lanac)) m.set(r.best.lanac, []);
      m.get(r.best.lanac).push(r);
    }
    return [...m.entries()].map(([code, list]) => ({ code, rows: list, sum: list.reduce((s, r) => s + r.best.ukupno, 0) }))
      .sort((a, b) => b.rows.length - a.rows.length || b.sum - a.sum);
  }
  // Odjeli redom kojim se obično prolazi kroz trgovinu; voće i povrće zajedno, smrznuto na kraju da se ne otopi.
  const AISLES = [["Voće i povrće", ["Voće", "Povrće"]], ["Kruh i peciva"], ["Meso"], ["Riba i plodovi mora"], ["Naresci i kobasice"],
    ["Mliječni proizvodi i jaja"], ["Tjestenina, riža i brašno"], ["Ulje, umaci i začini"], ["Konzerve i gotova jela"], ["Namazi i paštete"],
    ["Kava, čaj i kakao"], ["Slatkiši i grickalice"], ["Pića"], ["Za bebe"], ["Kućni ljubimci"], ["Higijena i kozmetika"], ["Čišćenje"],
    ["Kućanstvo"], ["Smrznuto"]];
  // Odjel stavke: najčešća vrsta među proizvodima koje stavka uspoređuje (ista u svakoj trgovini).
  function aisleOf(r) {
    const vrste = katalog.vrste || [];
    const count = new Map();
    const codes = (r.offers && r.offers.length ? r.offers.map((o) => o.kod) : r.best ? [r.best.kod] : []).concat(r.item.kodovi || []);
    for (const c of codes) {
      const t = byCode.get(c)?.[4];
      if (t != null && t >= 0) count.set(t, (count.get(t) || 0) + 1);
    }
    const top = [...count.entries()].sort((a, b) => b[1] - a[1])[0];
    const name = top ? vrste[top[0]] : null;
    const idx = AISLES.findIndex(([label, members]) => (members || [label]).includes(name));
    return idx < 0 ? AISLES.length : idx;
  }
  function aisleGroups(rows) {
    const m = new Map();
    for (const r of rows) { const a = aisleOf(r); if (!m.has(a)) m.set(a, []); m.get(a).push(r); }
    return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([a, list]) => [a < AISLES.length ? AISLES[a][0] : "Ostalo", list]);
  }
  const andList = (xs) => xs.length > 1 ? `${xs.slice(0, -1).join(", ")} i ${xs[xs.length - 1]}` : xs.join("");
  function cityNote(code) {
    const c = chains().find((x) => x.kod === code);
    if (!c || !katalog.grad) return "";
    if (c.zamjenskiGradovi) return `Cijene iz poslovnica u mjestima ${c.zamjenskiGradovi.join(", ")}; u gradu ${katalog.grad} se mogu razlikovati.`;
    if (c.cijelaHrvatska) return `Najčešće cijene u Hrvatskoj; za grad ${katalog.grad} nema cjenika.`;
    return "";
  }

  function planHtml() {
    if (!state.stavke.length) {
      return `<div class="card empty">
        <h2>Popis je prazan</h2>
        <p class="muted">Upiši što kupuješ, npr. „posni sir, toaletni papir, čajna kobasica”. Ovdje ćeš onda vidjeti gdje je što najjeftinije i u kojoj trgovini najbolje prolaziš.</p>
        <button class="btn primary" data-act="go" data-tab="popis">Upiši popis</button>
      </div>`;
    }
    const sel = selectedChains();
    if (!sel.length) {
      return `<div class="card empty"><h2>Nije odabrana nijedna trgovina</h2><p class="muted">Označi trgovine u kojima kupuješ.</p><button class="btn primary" data-act="go" data-tab="trgovine">Odaberi trgovine</button></div>`;
    }
    const plan = computePlan();
    const n = state.stavke.length;
    const opts = planOptions(plan);
    const cur = chosenPlan(plan, opts);
    const all = opts[opts.length - 1];
    const bestOne = opts[0].n === 1 ? opts[0] : null;
    const stops = stopsOf(cur.rows);
    const names = stops.map((s) => chainName(s.code));
    const used = cur.rows.filter((r) => r.best);
    const couponSaving = used.reduce((sum, r) => sum + (r.best.kupon ? r.best.bezKupona - r.best.ukupno : 0), 0);
    const cashback = used.reduce((sum, r) => sum + (r.best.povrat || 0), 0);
    const title = cur.n === 1 ? `Sve u trgovini ${chainName(cur.store || (stops[0] && stops[0].code) || "")}`
      : cur.n === "sve" ? `Najjeftinije za svaki proizvod: ${stops.length} ${plural(stops.length, "trgovina", "trgovine", "trgovina")}`
      : `U ${stops.length} ${plural(stops.length, "trgovinu", "trgovine", "trgovina")}: ${andList(names)}`;
    let saveLine = "";
    if (cur.n !== 1 && bestOne && bestOne.missing === cur.missing && bestOne.total > cur.total) {
      saveLine = `${eur(bestOne.total - cur.total)} jeftinije nego sve u trgovini ${chainName([...bestOne.set][0])}.`;
    } else if (cur.n === 1) {
      const better = opts.find((o) => o.n !== 1 && o.missing <= cur.missing && o.total < cur.total);
      if (better) saveLine = `U ${better.n === "sve" ? better.set.size : better.n} ${plural(better.n === "sve" ? better.set.size : better.n, "trgovinu", "trgovine", "trgovina")} uštediš ${eur(cur.total - better.total)}.`;
    }

    let h = exampleNotice();
    h += `<section class="card summary" aria-label="Ukupno">
      <div class="total">
        <div class="grow"><div class="label">Ukupno</div><div class="small" style="font-weight:600">${esc(title)}</div>
          <div class="small muted">${n - cur.missing} od ${n} ${plural(n, "proizvoda", "proizvoda", "proizvoda")}${cur.subs ? `, ${cur.subs} ${plural(cur.subs, "zamjena", "zamjene", "zamjena")}` : ""}</div></div>
        ${priceTag(cur.total, true)}
      </div>
      ${opts.length > 1 ? `<div class="seg" role="group" aria-label="U koliko trgovina ideš">${opts.map((o) => {
        const pressed = cur.n === o.n;
        const shown = pressed && cur.store ? cur : o;
        const label = o.n === "sve" ? `Sve (${o.set.size})` : o.n === 1 && cur.store ? chainName(cur.store) : `${o.n} ${plural(o.n, "trgovina", "trgovine", "trgovina")}`;
        return `<button data-act="plan-n" data-n="${o.n}" aria-pressed="${pressed}"><span class="n">${esc(label)}</span><span class="v">${esc(eur(shown.total))}</span>${shown.missing > all.missing ? `<span class="x">nema ${shown.missing - all.missing}</span>` : ""}</button>`;
      }).join("")}</div>` : ""}
      ${saveLine ? `<div class="savebar">${esc(saveLine)}</div>` : ""}
      ${couponSaving > 0 ? `<p class="small" style="color:var(--coupon);font-weight:600">Kuponi donose ${esc(eur(couponSaving))}. Prije kupnje ih aktiviraj u aplikaciji trgovine.</p>` : ""}
      ${cashback > 0 ? `<p class="small">Na blagajni platiš ${esc(eur(cur.total + cashback))}, a ${esc(eur(cashback))} ti se vrati kao BONUS euri za iduću kupnju.</p>` : ""}
      ${discountsHtml()}
    </section>`;

    const nowhere = cur.rows.filter((r) => !r.best && !r.anywhere);
    const elsewhere = cur.rows.filter((r) => !r.best && r.anywhere);
    if (nowhere.length || elsewhere.length) {
      h += `<div class="warn" role="note">
        ${elsewhere.length ? `<strong class="small">Nema u ${stops.length === 1 ? "ovoj trgovini" : "ovim trgovinama"}:</strong><ul>${elsewhere.map((r) =>
          `<li class="small"><button class="linkbtn" data-act="goto-item" data-id="${r.item.id}">${esc(r.item.naziv)}</button> · najjeftinije u trgovini ${esc(chainName(r.anywhere.lanac))}, ${esc(eur(r.anywhere.ukupno))}</li>`).join("")}</ul>` : ""}
        ${nowhere.length ? `<strong class="small">Nema ni u jednoj tvojoj trgovini:</strong><ul>${nowhere.map((r) =>
          `<li class="small"><button class="linkbtn" data-act="goto-item" data-id="${r.item.id}">${esc(r.item.naziv)}</button></li>`).join("")}</ul>` : ""}
      </div>`;
    }

    const doneCount = state.stavke.filter((s) => bought.has(s.id)).length;
    h += `<section class="section" aria-label="Što kupiti gdje"><div class="row" style="flex-wrap:wrap"><h2 class="grow">Što kupiti gdje</h2>${doneCount ? `<span class="small muted">Kupljeno ${doneCount} od ${n}</span><button class="btn small ghost" data-act="clear-bought">Očisti kvačice</button>` : ""}</div>`;
    for (const s of stops) {
      const note = cityNote(s.code);
      h += `<article class="card stop">
        <div class="stop-head"><span class="stop-name grow">${esc(chainName(s.code))}</span><span class="small muted">${s.rows.length} ${plural(s.rows.length, "proizvod", "proizvoda", "proizvoda")}</span><span class="tag plain">${esc(eur(s.sum))}</span></div>
        ${note ? `<p class="small muted stop-sub" style="padding-top:8px">${esc(note)}</p>` : ""}
        <ul class="lines">${aisleGroups(s.rows).map(([label, list]) => `<li class="aisle">${esc(label)}</li>${list.map((r) => lineHtml(r)).join("")}`).join("")}</ul>
      </article>`;
    }
    h += `<p class="small muted">Popis je složen po odjelima trgovine. Dodirni naziv za sve cijene i zamjene, a kvačicom označi što si već kupio.</p></section>`;
    h += compareHtml(plan, cur);
    return h;
  }

  function compareHtml(plan, cur) {
    const n = state.stavke.length;
    const complete = plan.single.filter((s) => !s.nema);
    const max = Math.max(...complete.map((s) => s.ukupno), 1);
    return `<details class="fold" id="cmp"${compareOpen ? " open" : ""}><summary>Usporedi trgovine</summary>
      <p class="muted small" style="margin-bottom:8px">Sve s popisa u jednoj trgovini, s akcijama, karticama, kuponima i uključenim popustima. Dodirni trgovinu da vidiš popis za nju.</p>
      <ul class="card compare">${plan.single.map((s, i) => {
        const on = cur.n === 1 && stopsOf(cur.rows)[0] && stopsOf(cur.rows)[0].code === s.lanac;
        return `<li class="${s.nema ? "partial" : i === 0 ? "best" : ""}">
          <button class="storebtn" data-act="plan-store" data-chain="${s.lanac}" aria-pressed="${on}" style="min-height:40px"><strong>${esc(chainName(s.lanac))}</strong> <span class="small muted">· ${s.ima} od ${n}${s.zamjena ? `, ${s.zamjena} ${plural(s.zamjena, "zamjena", "zamjene", "zamjena")}` : ""}</span></button>
          <div class="num" style="font-weight:600">${!s.ima ? "–" : s.nema ? `<span class="small muted">${esc(eur(s.ukupno))} za ${s.ima}</span>` : esc(eur(s.ukupno))}</div>
          ${!s.nema ? `<div class="bar"><i style="width:${Math.max(4, Math.round((s.ukupno / max) * 100))}%"></i></div>` : ""}
        </li>`;
      }).join("")}</ul>
    </details>`;
  }

  function lineHtml(r) {
    const o = r.best, item = r.item;
    const done = bought.has(item.id);
    const showName = !!item.upit || (item.kodovi || []).length > 1 || fold(o.naziv) !== fold(item.naziv);
    const per = item.upit ? unitNote(o) : "";
    return `<li class="line${done ? " done" : ""}">
      <input type="checkbox" class="tick" data-bought="${item.id}" ${done ? "checked" : ""} aria-label="Kupljeno: ${esc(item.naziv)}">
      <div class="grow"><button class="goto" data-act="goto-item" data-id="${item.id}">${esc(item.naziv)}</button>${item.primjer ? ` <span class="badge example">Primjer</span>` : ""}</div>
      <div class="price">${priceTag(o.ukupno, false, o.vaga && item.kom === 1)}</div>
      ${showName ? `<div class="what-line">${esc(o.naziv)}</div>` : ""}
      <div class="meta">
        ${offerBadges(o)}
        ${o.redovna ? `<span class="old">${esc(eur(o.redovna * item.kom))}</span>` : ""}
        ${item.kom > 1 ? `<span class="small muted">${esc(qtyNote(item, o))}</span>` : ""}
        ${per && !o.vaga ? `<span class="small muted">${esc(per)}</span>` : ""}
      </div>
    </li>`;
  }

  let browseOpen = false;
  let resultLimit = 8;
  // Zarez dijeli stavke, osim u brojevima ("1,5 l").
  const splitItems = (text) => String(text || "").split(/\n|;|,(?!\d)/).map((x) => x.trim()).filter((x) => x.length >= 2);
  const noCyrillic = (t) => (/[Ѐ-ӿ]/.test(t || "") ? "" : t || "");

  function popisHtml() {
    const target = addingAltFor ? state.stavke.find((s) => s.id === addingAltFor) : null;
    if (target) {
      return `<section class="section" aria-label="Dodaj zamjenu">
        <h2>Dodaj zamjenu za: ${esc(target.naziv)}</h2>
        <p class="small muted">Odaberi drugu marku ili pakiranje koje ti jednako odgovara. Aplikacija će u svakoj trgovini uzeti najjeftiniji od njih.</p>
        <div class="search"><input id="q" type="search" inputmode="search" autocomplete="off" aria-label="Traži proizvod" placeholder="Traži proizvod…" value="${esc(searchText)}"></div>
        <div id="results">${searchText.trim().length >= 2 ? resultsHtml() : ""}</div>
        <div><button class="btn" data-act="cancel-alt">Odustani</button></div>
      </section>`;
    }
    const empty = !state.stavke.length;
    let h = `<section class="section" aria-label="Dodaj na popis">
      <form class="addbar" data-form="add" autocomplete="off">
        <input id="q" type="search" enterkeyhint="done" autocomplete="off" aria-label="Dodaj na popis" placeholder="Dodaj, npr. mlijeko, jaja" value="${esc(searchText)}">
        <button class="btn primary">Dodaj</button>
      </form>
      ${empty ? `<p class="small muted">Upiši što kupuješ, a više stvari odvoji zarezom. Aplikacija za svaku stvar u svakoj trgovini nađe najjeftiniju marku. Za određenu marku napiši i nju („čajna kobasica gavrilović”), a za određeno pakiranje količinu („toaletni papir 16/1”).</p>` : ""}
      <div id="results" class="suggest">${searchText.trim().length >= 2 ? resultsHtml() : ""}</div>
      ${katalog.vrste ? `<div><button class="btn small" data-act="browse-open" aria-expanded="${browseOpen}">${browseOpen ? "Sakrij ideje ▴" : "Ideje po vrsti: voće, meso, bez glutena… ▾"}</button></div>` : ""}
      ${browseOpen && katalog.vrste ? browseHtml() : ""}
    </section>`;

    h += `<section class="section" aria-label="Moj popis" id="mylist"><h2>Moj popis${empty ? "" : ` (${state.stavke.length})`}</h2>`;
    if (classifying) {
      h += `<div class="notice"><div class="row"><span class="status grow">${esc(classifying.text)} Traje do pola minute.</span><button class="btn small" data-act="stop-classify">Zaustavi</button></div></div>`;
    } else if (sample && unchecked().length) {
      const n = unchecked().length;
      h += `<div class="notice"><div class="row"><span class="small grow">${n} ${plural(n, "stavku", "stavke", "stavki")} treba provjeriti: Claude provjeri što si mislio i koji proizvodi odgovaraju.</span><button class="btn small primary" data-act="classify-all">Provjeri</button></div></div>`;
    }
    if (empty) {
      h += `<div class="card empty"><p class="muted">Još nema proizvoda. Upiši ih iznad, npr. „posni sir, toaletni papir”.</p></div>`;
    } else {
      h += exampleNotice();
      currentPlan = computePlan();
      h += `<div class="card">${state.stavke.map(itemHtml).join("")}</div>`;
      currentPlan = null;
    }
    h += `<div class="listfoot"><div id="savestate-slot"></div>${empty ? "" : `<button class="btn small ghost danger" data-act="del-all">Obriši cijeli popis</button>`}</div></section>`;
    return h;
  }

  function resultsHtml() {
    const segs = splitItems(searchText);
    const last = segs[segs.length - 1] || searchText.trim();
    let h = "";
    if (!addingAltFor && segs.length) {
      const label = segs.length > 1 ? `+ Dodaj ${segs.length} ${plural(segs.length, "stavku", "stavke", "stavki")}: ${segs.join(", ")}` : `+ ${segs[0]}`;
      h += `<button class="gen-add" data-act="add-generic"><span>${esc(label)}<small>Bilo koja marka: u svakoj trgovini uzima se najjeftinija.</small></span></button>`;
    }
    const rows = last.length >= 2 ? search(last) : [];
    if (!rows.length) return h + (addingAltFor ? `<p class="small muted">Ništa nije pronađeno. Pokušaj s kraćim nazivom.</p>` : "");
    h += `${addingAltFor ? "" : `<p class="small muted">ili točno određeni proizvod:</p>`}<ul class="card results">${rows.slice(0, resultLimit).map(productRowHtml).join("")}</ul>`;
    if (rows.length > resultLimit) h += `<div><button class="btn small" data-act="results-more">Prikaži još</button></div>`;
    return h;
  }

  function itemHtml(item) {
    const sel = selectedChains();
    const planned = currentPlan && currentPlan.perItem.find((r) => r.item === item);
    const offers = planned ? planned.offers : sel.map((c) => offerAt(item, c)).filter(Boolean).sort(byOffer);
    const best = offers[0];
    const open = openItem === item.id;
    const g = item.upit ? genericMatches(item) : null;
    const ref = item.upit && currentPlan ? currentPlan.refs.get(item.id) : null;
    const vaga = !!(ref && ref.vaga);
    const picked = item.rucno && item.prihvaceni ? [...new Set(item.prihvaceni.map((c) => byCode.get(c)?.[1]).filter(Boolean))] : [];
    const badge = item.primjer ? `<span class="badge example">Primjer</span>`
      : item.rucno ? `<span class="badge manual">${picked.length === 1 ? "Samo odabrani proizvod" : `Odabrano: ${picked.length}`}</span>`
      : !item.upit ? `<span class="badge manual">Točno ovaj proizvod</span>` : "";
    const showProd = best && (item.upit || (item.kodovi || []).length > 1 || fold(best.naziv) !== fold(item.naziv));
    const none = g && !g.idx.length ? `Ništa ne odgovara „${esc(item.upit)}”. Probaj drukčiji naziv.` : "Nema u tvojim trgovinama";
    let h = `<div class="item${open ? " open" : ""}" data-item="${item.id}">
      <button class="item-main" data-act="toggle" data-id="${item.id}" aria-expanded="${open}">
        <span class="item-name">${esc(item.naziv)}</span>
        <span class="item-best">${best ? `<strong>${esc(chainName(best.lanac))}</strong> <span class="num">${esc(eur(best.ukupno))}${vaga && item.kom === 1 ? "/kg" : ""}</span> ${offerBadges(best)}` : `<span class="muted">${none}</span>`}</span>
        ${showProd ? `<span class="item-prod">${esc(best.naziv)}${unitNote(best) && item.upit && !best.vaga ? ` · ${esc(unitNote(best))}` : ""}</span>` : ""}
        ${badge ? `<span>${badge}</span>` : ""}
      </button>
      <div class="item-side">
        <button class="iconbtn" data-act="del" data-id="${item.id}" aria-label="Obriši ${esc(item.naziv)}" title="Obriši">×</button>
        <div class="qty" role="group" aria-label="Količina">
          <button data-act="qty" data-id="${item.id}" data-d="-1" aria-label="Manje">−</button>
          <span class="num">${item.kom}${vaga ? " kg" : ""}</span>
          <button data-act="qty" data-id="${item.id}" data-d="1" aria-label="Više">+</button>
        </div>
      </div>`;
    if (picking && picking.id === item.id) h += `<div class="item-panel">${pickerHtml(item)}</div>`;
    else if (open) h += `<div class="item-panel">${itemPanelHtml(item, offers, g, ref, picked)}</div>`;
    return h + `</div>`;
  }

  function itemPanelHtml(item, offers, g, ref, picked) {
    const sel = selectedChains();
    const single = new Set(offers.map((o) => o.naziv)).size <= 1 && !(item.upit && offers.some((o) => o.zamjena));
    let h = offers.length ? `<ul class="prices">${offers.map((o, i) => `<li class="${i === 0 ? "cheapest" : ""}">
        <span class="store">${esc(chainName(o.lanac))}</span>
        <span class="what">${single ? "" : `${esc(o.naziv)}${item.upit && unitNote(o) && !o.vaga ? ` · ${esc(unitNote(o))}` : ""} `}${offerBadges(o)}
          ${item.upit ? `<div><button class="nope" data-act="exclude" data-id="${item.id}" data-code="${esc(o.kod)}" aria-label="Nije to: ${esc(o.naziv)}">✕ Nije to</button></div>` : ""}</span>
        <span class="amt"><span class="num" style="font-weight:600">${esc(eur(o.ukupno))}</span>${o.redovna ? `<span class="old">${esc(eur(o.redovna * item.kom))}</span>` : o.kupon || o.popust ? `<span class="old">${esc(eur(o.bezKupona))}</span>` : ""}</span>
