<title>Pametna košarica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Raspored: jedan stupac kao blagajnički račun, cijene u stilu žutih etiketa s police; kartice na dnu za palac. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17201b;
  --muted: #5d6a62;
  --line: #d9dfda;
  --tag: #ffd60a;
  --tag-ink: #1a1a12;
  --sale: #d1222b;
  --sale-soft: #fde8e8;
  --save: #18794e;
  --save-soft: #e2f3ea;
  --coupon: #6a3fb5;
  --coupon-soft: #efe8fa;
  --focus: #1d5fd1;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: 2.5rem;
  --radius: 10px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #1a201c; --ink: #e9efea; --muted: #9aa8a0; --line: #2d3631;
    --tag: #f2c500; --tag-ink: #16160f; --sale: #ff6b6b; --sale-soft: #3a1c1e;
    --save: #4fd18b; --save-soft: #16301f; --coupon: #b99af0; --coupon-soft: #2a2140; --focus: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #1a201c; --ink: #e9efea; --muted: #9aa8a0; --line: #2d3631;
  --tag: #f2c500; --tag-ink: #16160f; --sale: #ff6b6b; --sale-soft: #3a1c1e;
  --save: #4fd18b; --save-soft: #16301f; --coupon: #b99af0; --coupon-soft: #2a2140; --focus: #7aa7ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 18px;
}
header.top { display: grid; gap: 2px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1; letter-spacing: 0.01em; text-wrap: balance; }
.brand span { background: var(--tag); color: var(--tag-ink); padding: 0 6px; border-radius: 4px; }
.sub { color: var(--muted); font-size: var(--step--1); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.num { font-variant-numeric: tabular-nums; }

/* Etiketa s cijenom */
.tag {
  display: inline-flex; align-items: baseline; gap: 2px;
  background: var(--tag); color: var(--tag-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1;
  padding: 4px 8px 3px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.tag.big { font-size: var(--step-3); padding: 6px 12px 4px; }
.tag.plain { background: transparent; color: var(--ink); padding-inline: 0; }
.old { color: var(--muted); text-decoration: line-through; font-size: var(--step--1); white-space: nowrap; }
.badge {
  display: inline-block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px; white-space: nowrap; line-height: 1.4;
}
.badge.sale { background: var(--sale); color: #fff; }
.badge.coupon { background: var(--coupon-soft); color: var(--coupon); border: 1px dashed var(--coupon); }
.badge.example { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.badge.cardb { background: transparent; color: var(--sale); border: 1px solid var(--sale); }
.stores .cardrow { padding: 0 14px 12px 48px; margin-top: -4px; }
.stores .cardrow label { padding: 0; gap: 10px; font-size: var(--step--1); }
.stores .cardrow input[type="checkbox"] { width: 18px; height: 18px; }
.badge.onlist { background: var(--save-soft); color: var(--save); }
.badge.disc { background: var(--save-soft); color: var(--save); border: 1px solid var(--save); }
.storebtn { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; min-width: 0; }
.storebtn strong { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.storelist { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 2px; }
.storelist .lines { padding: 0; }
.bulk textarea { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 1.0625rem; resize: vertical; min-height: 84px; }
.discounts { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.discounts label { align-items: flex-start; }
.discounts input { width: 20px; height: 20px; accent-color: var(--save); flex: none; margin-top: 1px; }
.picker { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--bg); }
.picker input[type="search"] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--surface); }
.pgroup { display: grid; gap: 2px; }
.pgroup-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0 2px; border-top: 1px solid var(--line); }
.pgroup-head strong { flex: 1 1 auto; }
.prow { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 6px 0; cursor: pointer; }
.prow input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--save); }
.prow .pmeta { grid-column: 2; font-size: var(--step--1); color: var(--muted); }
.picker-actions { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 8px 0 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.onestore { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.badge.expired { background: transparent; color: var(--muted); border: 1px solid var(--line); text-decoration: line-through; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.wraptext { overflow-wrap: anywhere; }

/* Plan kupnje */
.summary { padding: 16px; display: grid; gap: 12px; }
.summary .total { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.summary .label { font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.savebar { background: var(--save-soft); color: var(--save); border-radius: 6px; padding: 8px 10px; font-weight: 600; font-size: 0.9375rem; }
.stop { padding: 0; overflow: hidden; }
.stop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px dashed var(--line); }
.stop-name { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; line-height: 1; }
.lines { list-style: none; margin: 0; padding: 4px 14px 10px; display: grid; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line:last-child { border-bottom: 0; }
.line .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; grid-column: 1 / -1; }
.line .price { text-align: right; display: grid; justify-items: end; gap: 2px; }
.compare { list-style: none; margin: 0; padding: 0; display: grid; }
.compare li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.compare li:last-child { border-bottom: 0; }
.compare .bar { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.compare .bar i { display: block; height: 100%; background: var(--muted); opacity: 0.45; border-radius: 3px; }
.compare li.best .bar i { background: var(--save); opacity: 1; }

/* Popis */
.item { padding: 12px 14px; display: grid; gap: 8px; }
.item + .item { border-top: 1px solid var(--line); }
.item-top { display: flex; gap: 10px; align-items: flex-start; }
.item-name { font-weight: 600; overflow-wrap: anywhere; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.qty button { background: transparent; border: 0; width: 34px; height: 32px; font-size: 1.125rem; font-weight: 600; }
.qty span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.iconbtn { flex: none; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 1.25rem; line-height: 1; display: grid; place-items: center; }
.iconbtn:hover { color: var(--sale); border-color: var(--sale); }
.btn.danger.armed { background: var(--sale); color: #fff; border-color: var(--sale); }
.prices { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.prices li { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dotted var(--line); }
.prices li.cheapest .store { font-weight: 700; }
.prices .what { font-size: var(--step--1); color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.prices .amt { text-align: right; display: grid; justify-items: end; }
.alts { display: grid; gap: 4px; }
.alt { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); }
.alt .grow { overflow-wrap: anywhere; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 9px 14px; font-weight: 600; min-height: 40px;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--sale); }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: var(--step--1); }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--focus); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.search { position: relative; }
.search input {
  width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 14px; background: var(--surface);
  font-size: 1.0625rem;
}
.results { list-style: none; margin: 0; padding: 0; display: grid; }
.result { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.result:last-child { border-bottom: 0; }
.result .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.result.unavailable { opacity: 0.6; }

.notice { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; }
.notice.example { border-style: dashed; }
.empty { padding: 22px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; }

/* Kuponi */
.coupon { position: relative; padding: 12px 14px; border: 2px dashed var(--coupon); border-radius: var(--radius); background: var(--coupon-soft); display: grid; gap: 6px; }
.coupon.is-expired { border-color: var(--line); background: var(--surface); opacity: 0.75; }
.coupon-value { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1; color: var(--coupon); }
.form { display: grid; gap: 10px; padding: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: var(--step--1); font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--surface); min-height: 40px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }

/* Trgovine */
.stores { list-style: none; margin: 0; padding: 0; }
.stores li { border-bottom: 1px solid var(--line); }
.stores li:last-child { border-bottom: 0; }
.stores label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.stores input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--save); flex: none; }

/* Donja traka s karticama */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button {
  background: none; border: 0; height: var(--tabbar-h); display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: 0.75rem; font-weight: 600; color: var(--muted); position: relative;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::after { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: var(--tag); border-radius: 0 0 3px 3px; }
nav.tabs .count { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--sale); color: #fff; font-size: 0.625rem; border-radius: 999px; padding: 0 5px; line-height: 1.5; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9375rem;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / 0.18);
  display: flex; align-items: center; gap: 14px;
}
.toast button { background: transparent; border: 0; color: var(--tag); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; white-space: nowrap; }
.skeleton { height: 14px; border-radius: 4px; background: var(--line); }
.loading { padding: 18px 16px; display: grid; gap: 10px; }
.status { font-size: var(--step--1); color: var(--muted); }
.status.warn { color: var(--sale); }
details.help summary { cursor: pointer; font-weight: 600; }
details.help { padding: 12px 14px; }
details.help ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Pametna <span>košarica</span></div>
    <p class="sub" id="dataline">Učitavam današnje cijene…</p>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Glavni izbornik">
  <div class="inner" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      Gdje kupiti
    </button>
    <button role="tab" data-tab="popis" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Moj popis
    </button>
    <button role="tab" data-tab="kuponi" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>
      Kuponi
    </button>
    <button role="tab" data-tab="trgovine" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 1.9A3 3 0 0 1 12 14a3 3 0 0 1-2.7-1.1A3 3 0 0 1 4 11z"/><path d="M5.5 13.5V20h13v-6.5"/></svg>
      Trgovine
    </button>
  </div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";

  // ---------- Konstante ----------
  const DOC_PATH = "kosarica/glavna";
  const LOCAL_KEY = "pametna-kosarica-v1";
  const TAB_KEY = "pametna-kosarica-tab";
  const MAX_RESULTS = 30;

  // ---------- Stanje ----------
  let katalog = null;          // {datum, grad, lanci, gradovi, proizvodi}
  let byCode = new Map();      // kod -> red iz kataloga
  let cardPrices = new Map();  // lanac -> [{naziv, svi, cijene: Map(kod -> [[centi, od, do], ...])}]
  let folded = null;           // nazivi bez dijakritika, za pretragu
  let katalogError = "";
  let state = defaultState();
  let tab = "plan";
  let openItem = null;         // id stavke čije su cijene otvorene
  let addingAltFor = null;     // id stavke kojoj se dodaje zamjena
  let searchText = "";
  let db = null, docRef = null, dbStatus = "local", dirty = false, saving = false, saveTimer = null;
  let couponDraft = null;      // prijedlozi kupona sa snimke zaslona
  let sample = null, sampleImages = false, sampleMaxImages = 1, readingCoupon = null;

  function defaultState() {
    return { verzija: 1, trgovine: null, grad: "", stavke: [], kuponi: [], popusti: [] };
  }

  // ---------- Pomoćne funkcije ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const normText = (s) => fold(s).replace(/(\d),(\d)/g, "$1.$2");  // "2,8" i "2.8" su isto
  const fold = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
  const eur = (cents) => (cents / 100).toLocaleString("hr-HR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  const uid = () => Math.random().toString(36).slice(2, 10);
  const todayIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}.`; };
  const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };

  function toast(msg, action) {
    const t = $("#toast");
    t.textContent = "";
    const span = document.createElement("span");
    span.textContent = msg;
    t.append(span);
    if (action) {
      const b = document.createElement("button");
      b.dataset.act = action.act;
      b.textContent = action.label;
      t.append(b);
    }
    t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.hidden = true; }, action ? 7000 : 2600);
  }

  function chains() { return katalog ? katalog.lanci : []; }
  function chainIndex(code) { return chains().findIndex((c) => c.kod === code); }
  function chainName(code) { const c = chains().find((x) => x.kod === code); return c ? c.naziv : code; }
  function selectedChains() {
    const all = chains().filter((c) => c.poslovnica > 0).map((c) => c.kod);
    if (!state.trgovine) return all;
    return all.filter((c) => state.trgovine.includes(c));
  }

  // Cijena proizvoda u lancu: {cijena, redovna|null} u centima, ili null.
  function hasCard(code) { return !state.kartice || state.kartice[code] !== false; }
  function priceOf(row, chainIdx) {
    const p = row[2][chainIdx];
    if (p == null) return null;
    const base = Array.isArray(p) ? { cijena: p[0], redovna: p[1] } : { cijena: p, redovna: null };
    const code = katalog.lanci[chainIdx].kod;
    const today = todayIso();
    let best = base;
    for (const src of cardPrices.get(code) || []) {
      if (!src.svi && !hasCard(code)) continue;
      // Razdoblja su [centi, od, do]; prazan datum znači da granica nije poznata.
      const c = (src.cijene.get(row[0]) || []).find(([price, from, to]) => (!from || from <= today) && (!to || to >= today));
      if (c && c[0] < best.cijena) best = { cijena: c[0], redovna: base.redovna || base.cijena, kartica: src.svi ? null : src.naziv + (c[3] === "kupon" ? " kupon" : "") };
    }
    return best;
  }

  // ---------- Kuponi ----------
  function couponActive(k) { return !k.vrijediDo || k.vrijediDo >= todayIso(); }
  function couponLabel(k) {
    if (k.vrsta === "posto") return `-${k.vrijednost}%`;
    if (k.vrsta === "cijena") return eur(Math.round(k.vrijednost * 100));
    if (k.vrsta === "xy") return `Kupi ${k.x}, plati ${k.y}`;
    if (k.vrsta === "gratis") return "Gratis";
    return "";
  }
  // Kuponi koji vrijede za proizvod (kod) u lancu: povezani s proizvodom iz cjenika ili sa stavkom popisa.
  function couponsFor(code, kod, item) {
    return state.kuponi.filter((k) => k.lanac === code && couponActive(k) && ((item && k.stavka === item.id) || (k.kodovi || []).includes(kod)));
  }
  function couponOnList(k) {
    return state.stavke.some((s) => s.id === k.stavka || (k.kodovi || []).some((c) => (s.kodovi || []).includes(c)));
  }
  // Ukupno za količinu, s kuponom ako postoji.
  function totalWithCoupon(unit, qty, k) {
    if (!k) return unit * qty;
    if (k.vrsta === "gratis") return Math.max(0, qty - 1) * unit;
    if (k.vrsta === "posto") return Math.round(unit * qty * (100 - k.vrijednost) / 100);
    if (k.vrsta === "cijena") return Math.min(unit, Math.round(k.vrijednost * 100)) * qty;
    if (k.vrsta === "xy" && k.x > 0 && k.y >= 0 && k.y < k.x) {
      const groups = Math.floor(qty / k.x);
      return (qty - groups * (k.x - k.y)) * unit;
    }
    return unit * qty;
  }

  // ---------- Opće stavke ("posni sir", bilo koja marka) ----------
  // Količina iz naziva: "400 g", "1,5 l", "6x1L", "16/1" (role), "10 kom" -> {v, dim} u g, ml ili kom.
  function parseQty(name) {
    const t = fold(name).replace(/(\d),(\d)/g, "$1.$2");
    if (/\/\s*kg\b/.test(t)) return { v: 1000, dim: "g", vaga: true };  // na vagu, cijena po kilogramu
    let m = t.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|dl|cl|l)\b/);
    let n = 1, v, u;
    if (m) { n = +m[1]; v = +m[2]; u = m[3]; }
    else if ((m = t.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|dl|cl|l)\b/))) { v = +m[1]; u = m[2]; }
    else if ((m = t.match(/(\d+)\s*\/\s*1\b/)) || (m = t.match(/(\d+)\s*(?:kom|rola|role)\b/))) return +m[1] > 0 ? { v: +m[1], dim: "kom" } : null;
    else return null;
    const f = { kg: [1000, "g"], g: [1, "g"], l: [1000, "ml"], dl: [100, "ml"], cl: [10, "ml"], ml: [1, "ml"] }[u];
    return v > 0 ? { v: n * v * f[0], dim: f[1] } : null;
  }
  function qtyText(q) {
    if (!q) return "";
    if (q.vaga) return "kg (na vagu)";
    if (q.dim === "kom") return `${q.v} kom`;
    const big = q.v >= 1000;
    const n = big ? q.v / 1000 : q.v;
    return `${String(Math.round(n * 100) / 100).replace(".", ",")} ${q.dim === "g" ? (big ? "kg" : "g") : (big ? "l" : "ml")}`;
  }
  // Riječi upita bez količine; kratke riječi ("sir") moraju biti cijele, duže se traže po korijenu.
  const FILLER = new Set(["za", "i", "s", "sa", "od", "na", "u", "ili", "the", "and", "of", "with", "for"]);
  function queryWords(q) {
    return normText(q)
      .replace(/\d+(?:\.\d+)?\s*(?:kg|g|ml|dl|cl|l)\b|\d+\s*\/\s*1\b|\d+\s*kom\b/g, " ")
      .split(/[^a-z0-9.]+/).map((w) => w.replace(/^\.+|\.+$/g, ""))
      .filter((w) => (w.length >= 2 || /^\d$/.test(w)) && !FILLER.has(w));
  }
  const genericCache = new Map();
  // Pojmovi za pretragu: ono što je kupac upisao i nazivi koje trgovci koriste ("ubrus" -> "papirnati ručnik").
  function termsOf(item) { return [item.upit, ...(item.pojmovi || [])]; }
  // Koliko se riječ upita poklapa s nazivom: 1 = ista riječ ("banane" ~ "banana"), 0,6 = dulja izvedenica
  // ("bananko", "bananom"), 0 = nema. Riječ se uvijek mora poklapati od početka ("tasty" nije u "dentastix").
  function wordScorer(w) {
    if (w.length <= 3 || /\d/.test(w)) {
      const re = new RegExp(`(^|[^a-z0-9.])${w.replace(/\./g, "\\.")}($|[^a-z0-9])`);
      return (name) => (name.includes(w) && re.test(name) ? 1 : 0);
    }
    const stem = w.slice(0, Math.max(4, w.length - 2));
    return (name) => {
      if (!name.includes(stem)) return 0;
      let best = 0;
      for (const m of name.matchAll(new RegExp(`(^|[^a-z0-9])(${stem}[a-z0-9]*)`, "g"))) {
        best = Math.max(best, m[2].length <= stem.length + 2 ? 1 : 0.3);
        if (best === 1) break;
      }
      return best;
    };
  }
  // Kandidati za opću stavku. Cjenici skraćuju nazive ("Posl.za pse pedigr.tasty 140 g" je "Pedigree Tasty
  // Minis"), pa ne moraju sve riječi biti u nazivu: od 3 i više riječi dovoljno je oko 60 %. Najbolji
  // pogoci idu prvi; bez provjere se uspoređuju samo oni iz najbolje skupine.
  function genericMatches(item) {
    const key = termsOf(item).join("|");
    if (genericCache.has(key)) return genericCache.get(key);
    ensureFolded();
    const terms = termsOf(item).map((t) => {
      const words = queryWords(t);
      const firstStem = words[0] && words[0].length > 3 ? words[0].slice(0, Math.max(4, words[0].length - 2)) : words[0] || "";
      return { scorers: words.map(wordScorer), firstStem, need: words.length <= 2 ? words.length : Math.ceil(words.length * 0.6) };
    }).filter((t) => t.scorers.length);
    const hits = [];
    for (let i = 0; i < folded.length; i++) {
      const name = folded[i];
      let best = -1;
      for (const t of terms) {
        let n = 0, sum = 0;
        for (const sc of t.scorers) { const v = sc(name); if (v) { n++; sum += v; } }
        if (n < t.need) continue;
        // Prednost: upisana vrsta proizvoda je prva ili druga riječ naziva (iza marke), npr. "Banana /kg",
        // "Dukat Mlijeko", a ne usputno spomenuta ("Voćna kaša jabuka i banana").
        const lead = t.firstStem && name.split(/[^a-z0-9]+/).filter(Boolean).slice(0, 2)
          .some((w) => w.startsWith(t.firstStem) && w.length <= t.firstStem.length + 2) ? 0.05 : 0;
        best = Math.max(best, sum / t.scorers.length + lead);
      }
      if (best >= 0) hits.push([best - name.length / 5000, i]);
    }
    hits.sort((a, b) => b[0] - a[0]);
    const kept = hits.slice(0, 1500);
    const idx = kept.map((h) => h[1]);
    const topScore = kept.length ? kept[0][0] : 0;
    const strict = new Set(kept.filter((h) => h[0] >= topScore - 0.1).map((h) => h[1]));
    const qByCode = new Map(idx.map((i) => [katalog.proizvodi[i][0], parseQty(katalog.proizvodi[i][1])]));
    const res = { idx, strict, qty: parseQty(item.upit), qByCode };
    genericCache.set(key, res);
    return res;
  }
  // Koji kandidati smiju u usporedbu. Nakon provjere samo oni koje je Claude prihvatio; bez provjere
  // izbacuje se očiti pribor ("držač za ubrus", "krema za pelene").
  const ACCESSORY = /(^|[^a-z])(drzac|nosac|stalak|dozator)/;
  function allowedFilter(item) {
    const skip = new Set(item.iskljuceni || []);
    if (item.prihvaceni) {
      const ok = new Set(item.prihvaceni);
      return (code) => ok.has(code) && !skip.has(code);
    }
    const g = genericMatches(item);
    const onlyStrict = g.strict.size > 0;
    const raw = normText(item.upit).split(/[^a-z0-9.]+/);
    const afterZa = new Set(raw.filter((w, n) => n > 0 && raw[n - 1] === "za"));
    const stems = queryWords(item.upit).filter((w) => w.length > 3 && !afterZa.has(w)).map((w) => w.slice(0, Math.max(4, w.length - 2)));
    const forThing = stems.map((st) => new RegExp(`(^|[^a-z])za\\s+[a-z]*${st}`));
    const wantsAccessory = ACCESSORY.test(normText(item.upit));
    return (code, i) => {
      if (skip.has(code) || (onlyStrict && !g.strict.has(i))) return false;
      const name = folded[i];
      if (!wantsAccessory && ACCESSORY.test(name)) return false;
      return !forThing.some((re) => re.test(name));
    };
  }
  // Pakiranje s kojim se uspoređuje: količina iz upita, inače najčešće pakiranje u odabranim trgovinama.
  function genericRef(item, g, selIdx) {
    if (g.qty) return { ...g.qty, tol: 0.05 };
    const dims = new Map(), counts = new Map();
    const allowed = allowedFilter(item);
    let weighed = 0, total = 0;
    for (const i of g.idx) {
      const row = katalog.proizvodi[i];
      if (!allowed(row[0], i) || !selIdx.some((ci) => row[2][ci] != null)) continue;
      const q = g.qByCode.get(row[0]);
      if (!q) continue;
      total++;
      if (q.vaga) { weighed++; continue; }
      dims.set(q.dim, (dims.get(q.dim) || 0) + 1);
      const k = `${q.dim}:${Number(q.v.toPrecision(2))}`;
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    // Ako se proizvod uglavnom prodaje na vagu (banane), uspoređuje se cijena po kg; inače pakiranja.
    if (weighed && weighed >= total * 0.8) return { v: 1000, dim: "g", tol: null, vaga: true };
    if (!dims.size) return null;
    const dim = [...dims.entries()].sort((a, b) => b[1] - a[1])[0][0];
    const top = [...counts.entries()].filter(([k]) => k.startsWith(dim + ":"))
      .sort((a, b) => b[1] - a[1] || parseFloat(a[0].split(":")[1]) - parseFloat(b[0].split(":")[1]))[0];
    return { v: parseFloat(top[0].split(":")[1]), dim, tol: null };
  }
  function fitsRef(q, ref) {
    if (!ref) return true;
    if (ref.vaga || (q && q.vaga)) return !!(q && q.vaga && ref.vaga);
    if (!q || q.dim !== ref.dim) return false;
    return ref.tol != null ? Math.abs(q.v - ref.v) <= ref.v * ref.tol : q.v >= ref.v * 0.75 && q.v <= ref.v * 1.35;
  }
  function billDiscounts(code) { return (state.popusti || []).filter((d) => d.ukljucen && d.lanac === code); }

  // Najbolja ponuda stavke u jednom lancu: najjeftiniji proizvod iz stavke (ili iz pretrage za opću
  // stavku), s kuponom, cijenom uz karticu i popustom na račun.
  function offerAt(item, code, ctx) {
    const idx = chainIndex(code);
    if (idx < 0) return null;
    let codes = item.kodovi || [], g = null, ref = null;
    if (item.upit) {
      g = genericMatches(item);
      ref = ctx && ctx.refs ? ctx.refs.get(item.id) : genericRef(item, g, selectedChains().map(chainIndex));
      const allowed = allowedFilter(item);
      codes = g.idx.filter((i) => allowed(katalog.proizvodi[i][0], i)).map((i) => katalog.proizvodi[i][0]);
    }
    const discounts = billDiscounts(code);
    let best = null, fallback = null;
    for (const kod of codes) {
      const row = byCode.get(kod);
      if (!row) continue;
      const p = priceOf(row, idx);
      if (!p) continue;
      const q = g ? g.qByCode.get(kod) : null;
      const fits = !g || fitsRef(q, ref);
      const perUnit = q ? Math.round(p.cijena / q.v * (q.dim === "kom" ? 1 : 1000)) : null;
      for (const k of [null, ...couponsFor(code, kod, item)]) {
        const withCoupon = totalWithCoupon(p.cijena, item.kom, k);
        let total = withCoupon, popust = null;
        for (const d of discounts) {
          if (d.samoRedovne && (k || p.redovna || p.kartica)) continue;  // samo proizvodi koji nisu na sniženju
          const t = Math.round(withCoupon * (100 - d.posto) / 100);
          if (t < total) { total = t; popust = d; }
        }
        const offer = { lanac: code, kod, naziv: row[1], cijena: p.cijena, redovna: p.redovna, kartica: p.kartica, ukupno: total, kupon: k,
          bezKupona: p.cijena * item.kom, povrat: k && k.povrat ? p.cijena * item.kom - withCoupon : 0, popust,
          jedinicna: perUnit, jedinica: q ? (q.dim === "g" ? "kg" : q.dim === "ml" ? "l" : "kom") : "" };
        if (fits) {
          if (!best || total < best.ukupno) best = offer;
        } else if (q && ref && q.dim === ref.dim) {
          // Nema sličnog pakiranja: uzmi najbliže po veličini (16 rola, a ne 80 vlažnih maramica).
          const dist = Math.abs(Math.log(q.v / ref.v));
          if (!fallback || dist < fallback.dist - 1e-9 || (Math.abs(dist - fallback.dist) < 1e-9 && total < fallback.ukupno)) {
            fallback = { ...offer, drugoPakiranje: true, dist };
          }
        }
      }
    }
    return best || fallback;
  }

  const byOffer = (a, b) => ((a.drugoPakiranje ? 1 : 0) - (b.drugoPakiranje ? 1 : 0)) || (a.ukupno - b.ukupno);

  function computePlan() {
    const sel = selectedChains();
    const selIdx = sel.map(chainIndex);
    const refs = new Map();
    for (const item of state.stavke) if (item.upit) refs.set(item.id, genericRef(item, genericMatches(item), selIdx));
    const ctx = { refs };
    const perItem = state.stavke.map((item) => {
      const offers = sel.map((c) => offerAt(item, c, ctx)).filter(Boolean).sort(byOffer);
      return { item, offers, best: offers[0] || null };
    });
    // Kad je ista najniža cijena u više trgovina, biraj trgovinu u kojoj se ionako kupuje više stvari.
    const score = new Map();
    for (const r of perItem) {
      if (!r.best) continue;
      for (const o of r.offers) if (o.ukupno === r.best.ukupno && !o.drugoPakiranje) score.set(o.lanac, (score.get(o.lanac) || 0) + 1);
    }
    for (const r of perItem) {
      if (!r.best) continue;
      const ties = r.offers.filter((o) => o.ukupno === r.best.ukupno && !!o.drugoPakiranje === !!r.best.drugoPakiranje);
      r.best = ties.reduce((a, b) => ((score.get(b.lanac) || 0) > (score.get(a.lanac) || 0) ? b : a), ties[0]);
      r.offers = [r.best, ...r.offers.filter((o) => o !== r.best)];
    }
    const stops = new Map();
    let total = 0, missing = [];
    for (const r of perItem) {
      if (!r.best) { missing.push(r.item); continue; }
      total += r.best.ukupno;
      if (!stops.has(r.best.lanac)) stops.set(r.best.lanac, []);
      stops.get(r.best.lanac).push(r);
    }
    const single = sel.map((c) => {
      let sum = 0, have = 0;
      for (const r of perItem) {
        const o = r.offers.find((x) => x.lanac === c);
        if (o) { sum += o.ukupno; have++; }
      }
      return { lanac: c, ukupno: sum, ima: have, nema: perItem.length - have };
    }).sort((a, b) => (a.nema - b.nema) || (a.ukupno - b.ukupno));
    return { perItem, stops, total, missing, single, refs };
  }

  // ---------- Spremanje ----------
  function loadLocal() {
    try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
  }
  // Postavke i kuponi su jedan dokument (kosarica/glavna), a svaka stavka popisa svoj dokument
  // (popis/<id>), da više ljudi može istodobno dodavati i brisati stavke bez prebrisivanja.
  const ITEMS_PATH = "popis";
  let itemsCol = null, syncReady = false, syncedItems = new Map(), syncedMain = null;
  let lastItemsSnap = null, lastMainSnap = null;
  const stable = (v) => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x)
    ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))) : x));
  const plain = (v) => JSON.parse(JSON.stringify(v));
  function mainPart() { const { stavke, ...rest } = state; return plain(rest); }
  function sortItems(list) { return list.sort((a, b) => (a.vrijeme || 0) - (b.vrijeme || 0) || String(a.id).localeCompare(String(b.id))); }
  function itemsFrom(snap) { return sortItems(snap.docs.filter((d) => d.exists).map((d) => ({ ...plain(d.data()), id: d.id }))); }

  function commit(msg, action) {
    dirty = true;
    saveLocal();
    render();
    if (msg) toast(msg, action);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }
  async function flush() {
    if (!docRef || !syncReady || saving) return;
    saving = true;
    try {
      while (dirty) {
        dirty = false;
        const wanted = new Map(state.stavke.map((it) => [it.id, plain(it)]));
        for (const [id, obj] of wanted) {
          const json = stable(obj);
          if (syncedItems.get(id) !== json) { await itemsCol.doc(id).set(obj); syncedItems.set(id, json); }
        }
        for (const id of [...syncedItems.keys()]) {
          if (!wanted.has(id)) { await itemsCol.doc(id).delete(); syncedItems.delete(id); }
        }
        const main = mainPart(), mainJson = stable(main);
        if (mainJson !== syncedMain) { await docRef.set(main); syncedMain = mainJson; }
      }
      setDbStatus("saved");
    } catch (e) {
      setDbStatus(e && e.code === "invalid_argument" ? "readonly" : "error");
    } finally {
      saving = false;
      // Promjene drugih koje su stigle dok smo spremali.
      if (lastMainSnap) applyMainSnap(lastMainSnap);
      if (lastItemsSnap) applyItemsSnap(lastItemsSnap);
    }
  }
  function applyItemsSnap(snap) {
    lastItemsSnap = snap;
    if (dirty || saving) return;
    const remote = itemsFrom(snap);
    syncedItems = new Map(remote.map((it) => [it.id, stable(it)]));
    if (stable(remote) !== stable(state.stavke)) { state.stavke = remote; saveLocal(); render(); }
  }
  function applyMainSnap(snap) {
    lastMainSnap = snap;
    if (dirty || saving || !snap.exists) return;
    const data = plain(snap.data());
    delete data.stavke;
    syncedMain = stable(data);
    if (syncedMain !== stable(mainPart())) { state = Object.assign(defaultState(), data, { stavke: state.stavke }); saveLocal(); render(); }
  }

  function setDbStatus(s) { dbStatus = s; const el = $("#savestate"); if (el) el.replaceWith(saveStateEl()); }
  function saveStateEl() {
    const span = document.createElement("span");
    span.id = "savestate";
    const map = {
      local: "Spremljeno na ovom uređaju.",
      connecting: "Povezujem spremanje…",
      saved: "Popis je spremljen i vidiš ga na svakom uređaju.",
      slow: "Spremanje se još ne javlja. Promjene se zasad čuvaju na ovom uređaju.",
      error: "Spremanje trenutno ne radi. Promjene se zasad čuvaju na ovom uređaju.",
      readonly: "Ovaj popis možeš samo gledati. Za upisivanje te vlasnik treba pozvati s pravom uređivanja.",
    };
    span.textContent = map[dbStatus] || "";
    span.className = "status" + (dbStatus === "error" || dbStatus === "slow" ? " warn" : "");
    return span;
  }

  async function connectDb() {
    if (!window.claude || typeof window.claude.use !== "function") { setDbStatus("local"); return; }
    setDbStatus("connecting");
    const slowTimer = setTimeout(() => setDbStatus("slow"), 10000);
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { clearTimeout(slowTimer); setDbStatus("local"); return; }
    connectUser();
    docRef = db.doc(DOC_PATH);
    itemsCol = db.collection(ITEMS_PATH);
    let mainSnap = null, itemsSnap = null;
    const settle = () => {
      if (syncReady || !mainSnap || !itemsSnap) return;
      syncReady = true;
      clearTimeout(slowTimer);
      if (dbStatus !== "error") setDbStatus("saved");
      const data = mainSnap.exists ? plain(mainSnap.data()) : null;
      const legacy = data && Array.isArray(data.stavke) ? data.stavke : null;
      const remote = itemsFrom(itemsSnap);
      syncedItems = new Map(remote.map((it) => [it.id, stable(it)]));
      if (data) {
        delete data.stavke;
        state = Object.assign(defaultState(), data, { stavke: state.stavke });
        syncedMain = legacy ? null : stable(data);   // stari oblik: dokument treba prepisati bez stavki
      }
      if (!remote.length && (legacy || !data)) {
        // Prvi put u novom obliku: stavke iz starog dokumenta (ili s ovog uređaja) postaju zasebni zapisi.
        const t0 = Date.now();
        state.stavke = (legacy || state.stavke).map((it, n) => ({ ...it, vrijeme: it.vrijeme || t0 + n }));
        if (state.stavke.length || !data || legacy) dirty = true;
      } else {
        state.stavke = remote;
        if (!data || legacy) dirty = true;
      }
      saveLocal();
      render();
      if (dirty) flush();
    };
    const onErr = () => { clearTimeout(slowTimer); setDbStatus("error"); };
    docRef.onSnapshot((snap) => {
      if (!syncReady) { if (!snap.metadata.fromCache) { mainSnap = snap; settle(); } return; }
      applyMainSnap(snap);
    }, onErr);
    itemsCol.onSnapshot((snap) => {
      if (!syncReady) { if (!snap.metadata.fromCache) { itemsSnap = snap; settle(); } return; }
      applyItemsSnap(snap);
    }, onErr);
  }

  // Tko je dodao stavku (na zajedničkom popisu). Spremaju se samo id-jevi, imena se čitaju pri prikazu.
  let userCap = null, myId = null;
  const people = {};
  async function connectUser() {
    try { userCap = await window.claude.use("user"); } catch (e) { userCap = null; }
    if (!userCap) return;
    try { myId = await userCap.id(); } catch (e) { myId = null; }
    render();
  }
  async function refreshPeople() {
    if (!userCap) return;
    const ids = [...new Set(state.stavke.map((it) => it.dodao).filter((x) => x && x !== myId))];
    if (!ids.length) return;
    let ps = {};
    try { ps = await userCap.profiles(ids); } catch (e) { return; }
    let changed = false;
    for (const id of ids) {
      const nm = (ps[id] && ps[id].name) || "";
      if (people[id] !== nm) { people[id] = nm; changed = true; }
    }
    if (changed) render();
  }
  function newItem(fields) { return { id: uid(), kom: 1, vrijeme: Date.now(), ...(myId ? { dodao: myId } : {}), ...fields }; }

  async function connectSample() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try { sample = await window.claude.use("sample"); } catch (e) { sample = null; }
    if (!sample) return;
    try {
      const lim = await sample.limits();
      sampleImages = !!(lim && lim.images);
      sampleMaxImages = Math.max(1, Math.min(6, (lim && lim.images && lim.images.maxCount) || 1));
    } catch (e) { sampleImages = false; }
    if (tab === "kuponi" || tab === "popis") render();
  }

  // ---------- Katalog ----------
  async function loadKatalog() {
    try {
      const res = await fetch("katalog.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("http " + res.status);
      let text;
      const buf = await res.arrayBuffer();
      const bytes = new Uint8Array(buf);
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
        if (typeof DecompressionStream === "undefined") throw new Error("nogzip");
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder().decode(bytes);   // poslužitelj ga je već raspakirao
      }
      katalog = JSON.parse(text);
      byCode = new Map(katalog.proizvodi.map((r) => [r[0], r]));
      cardPrices = new Map();
      for (const k of katalog.kartice || []) {
        if (!cardPrices.has(k.lanac)) cardPrices.set(k.lanac, []);
        cardPrices.get(k.lanac).push({ naziv: k.naziv, svi: !!k.svi, cijene: new Map(Object.entries(k.cijene || {})) });
      }
      const label = katalog.grad ? `poslovnice u gradu ${katalog.grad}` : "cijela Hrvatska";
      $("#dataline").textContent = `Cijene iz službenih cjenika od ${fmtDate(katalog.datum)} · ${label}`;
    } catch (e) {
      katalogError = e && e.message === "nogzip"
        ? "Ovaj preglednik je prestar za učitavanje cijena. Otvori stranicu u novijem pregledniku."
        : "Cijene se nisu učitale. Provjeri internetsku vezu i otvori stranicu ponovno.";
      $("#dataline").textContent = katalogError;
    }
    render();
  }
  function ensureFolded() {
    if (!folded && katalog) folded = katalog.proizvodi.map((r) => normText(r[1]));
  }
  function search(q) {
    ensureFolded();
    const toks = normText(q).split(/\s+/).filter(Boolean);
    if (!toks.length || !folded) return [];
    const sel = selectedChains().map(chainIndex);
    const out = [];
    for (let i = 0; i < folded.length && out.length < 400; i++) {
      if (toks.every((t) => folded[i].includes(t))) out.push(i);
    }
    const score = (i) => {
      const r = katalog.proizvodi[i];
      const inSel = sel.filter((ix) => r[2][ix] != null).length;
      const starts = folded[i].startsWith(toks[0]) ? 1 : 0;
      return inSel * 10 + starts * 3 - r[1].length / 100;
    };
    return out.map((i) => [score(i), katalog.proizvodi[i]]).sort((a, b) => b[0] - a[0]).slice(0, MAX_RESULTS).map((x) => x[1]);
  }
  function cheapestSelected(row) {
    let best = null;
    for (const code of selectedChains()) {
      const p = priceOf(row, chainIndex(code));
      if (!p) continue;
      let price = p.cijena, kupon = null;
      for (const k of couponsFor(code, row[0], null)) {
        const t = totalWithCoupon(p.cijena, 1, k);
        if (t < price) { price = t; kupon = k; }
      }
      if (!best || price < best.cijena) best = { ...p, cijena: price, kupon, lanac: code };
    }
    return best;
  }
  // Proizvodi jednog lanca koji najbolje odgovaraju tekstu s kupona.
  function findAtChain(text, code, limit) {
    ensureFolded();
    const idx = chainIndex(code);
    const toks = [...new Set(fold(text).split(/[^a-z0-9]+/).filter((t) => t.length >= 2))];
    if (!toks.length || idx < 0) return [];
    const hits = [];
    for (let i = 0; i < folded.length; i++) {
      if (katalog.proizvodi[i][2][idx] == null) continue;
      const score = toks.reduce((sum, t) => sum + (folded[i].includes(t) ? t.length : 0), 0);
      if (score > 0) hits.push([score, i]);
    }
    hits.sort((a, b) => b[0] - a[0] || folded[a[1]].length - folded[b[1]].length);
    return hits.slice(0, limit).map((h) => katalog.proizvodi[h[1]]);
  }

  // ---------- Prikaz ----------
  try { if (localStorage.getItem("pk-debug")) window.__kosarica = { genericMatches, genericRef, allowedFilter, katalog: () => katalog, selectedChains, chainIndex }; } catch (e) {}
  function render() {

    const html = { plan: planHtml, popis: popisHtml, kuponi: kuponiHtml, trgovine: trgovineHtml }[tab]();
    const focusId = document.activeElement && document.activeElement.id;

  function planHtml() {
    if (!state.stavke.length) {
      return `<div class="card empty">
        <h2>Popis je prazan</h2>

    }

    if (!sel.length) {
      return `<div class="card empty"><h2>Nije odabrana nijedna trgovina</h2><p class="muted">Označi trgovine u kojima kupuješ.</p><button class="btn primary" data-act="go" data-tab="trgovine">Odaberi trgovine</button></div>`;

    const saving = bestSingle ? bestSingle.ukupno - plan.total : 0;

    const cashback = plan.perItem.reduce((sum, r) => sum + (r.best ? r.best.povrat || 0 : 0), 0);
    const stops = [...plan.stops.entries()].map(([code, rows]) => ({ code, rows, sum: rows.reduce((s, r) => s + r.best.ukupno, 0) }))
      .sort((a, b) => b.rows.length - a.rows.length || b.sum - a.sum);

    let h = exampleNotice();
    h += `<section class="card summary" aria-label="Ukupno">
      <div class="total">
        <div><div class="label">Najjeftinije ukupno</div><div class="muted small">${stops.length} ${plural(stops.length, "trgovina", "trgovine", "trgovina")}, ${n - plan.missing.length} ${plural(n - plan.missing.length, "proizvod", "proizvoda", "proizvoda")}</div></div>
        ${priceTag(plan.total, true)}
      </div>
      ${bestSingle ? `<div class="onestore"><span class="label">Sve na jednom mjestu</span> <span>najjeftinije u trgovini <strong>${esc(chainName(bestSingle.lanac))}</strong>: <strong class="num">${esc(eur(bestSingle.ukupno))}</strong></span> <button class="linkbtn" data-act="store-list" data-chain="${bestSingle.lanac}">Popis za ${esc(chainName(bestSingle.lanac))}</button></div>`
        : mostItems && mostItems.ima ? `<p class="small">Nijedna trgovina nema sve s popisa. Najviše ima ${esc(chainName(mostItems.lanac))}: ${mostItems.ima} od ${n}.</p>` : ""}
      ${saving > 0 ? `<div class="savebar">Ako ideš u više trgovina, uštediš još ${esc(eur(saving))}.</div>` : ""}
      ${couponSaving > 0 ? `<p class="small" style="color:var(--coupon);font-weight:600">Kuponi donose ${esc(eur(couponSaving))}. Prije kupnje ih aktiviraj u aplikaciji trgovine.</p>` : ""}
      ${cashback > 0 ? `<p class="small">Na blagajni platiš ${esc(eur(plan.total + cashback))}, a ${esc(eur(cashback))} ti se vrati kao BONUS euri za iduću kupnju.</p>` : ""}
      ${plan.missing.length ? `<p class="small muted">Nema ni u jednoj tvojoj trgovini: ${plan.missing.map((m) => esc(m.naziv)).join(", ")}.</p>` : ""}
      ${discountsHtml()}

    const max = Math.max(...plan.single.map((s) => s.ukupno), 1);
    h += `<section class="section" aria-label="Sve u jednoj trgovini"><h2>Sve u jednoj trgovini</h2>
      <p class="muted small">Ako sve kupuješ na jednom mjestu. Akcije, kartice, kuponi i uključeni popusti su uračunati. Dodirni trgovinu za popis što tamo kupiti.</p>
      <ul class="card compare">${plan.single.map((s, i) => {
        const open = openStore === s.lanac;
        return `<li class="${i === 0 && s.nema === 0 ? "best" : ""}">
        <button class="storebtn" data-act="store-list" data-chain="${s.lanac}" aria-expanded="${open}"><strong>${esc(chainName(s.lanac))}</strong>${!s.ima ? ` <span class="small muted">· nema ništa s popisa</span>` : s.nema ? ` <span class="small muted">· nema ${s.nema} ${plural(s.nema, "proizvod", "proizvoda", "proizvoda")}</span>` : ""}</button>
        <div class="num" style="font-weight:600">${s.ima ? esc(eur(s.ukupno)) : "–"}</div>
        ${s.ima ? `<div class="bar"><i style="width:${Math.max(4, Math.round((s.ukupno / max) * 100))}%"></i></div>` : ""}

        <div class="grow">

          <div class="small muted">${best ? `Najjeftinije: <strong>${esc(chainName(best.lanac))}</strong>, ${esc(eur(best.ukupno))}${item.kom > 1 ? " ukupno" : ""}`
            : g && !g.idx.length ? `Nijedan proizvod ne odgovara upitu „${esc(item.upit)}”. Probaj kraći ili drukčiji naziv.` : "Nema u tvojim trgovinama"}
          ${best ? offerBadges(best) : ""}</div>
          ${best && item.upit ? `<div class="small muted wraptext">${esc(best.naziv)}${unitNote(best) ? ` · ${esc(unitNote(best))}` : ""}</div>` : ""}
          ${item.znacenje ? `<div class="small wraptext">Shvaćeno kao: ${esc(item.znacenje)}</div>` : ""}
        </div>
        <div class="qty" role="group" aria-label="Količina">
          <button data-act="qty" data-id="${item.id}" data-d="-1" aria-label="Manje">−</button>
          <span class="num">${item.kom}</span>
          <button data-act="qty" data-id="${item.id}" data-d="1" aria-label="Više">+</button>
        </div>
        <button class="iconbtn" data-act="del" data-id="${item.id}" aria-label="Obriši ${esc(item.naziv)}" title="Obriši">×</button>
      </div>
      ${item.dodao && myId && item.dodao !== myId ? `<div class="small muted">Dodano: ${esc(people[item.dodao] || "netko drugi")}</div>` : ""}
      <div class="row" style="flex-wrap:wrap;gap:6px 16px"><button class="linkbtn" data-act="toggle" data-id="${item.id}" aria-expanded="${open}">${open ? "Sakrij cijene" : `Cijene u ${offers.length} ${plural(offers.length, "trgovini", "trgovine", "trgovina")}`}</button>${item.upit ? `<button class="linkbtn" data-act="pick" data-id="${item.id}">${picking && picking.id === item.id ? "Zatvori odabir" : "Odaberi proizvode"}</button>` : ""}</div>
      ${picking && picking.id === item.id ? pickerHtml(item) : ""}`;
    if (open) {
      h += `<ul class="prices">${offers.map((o, i) => `<li class="${i === 0 ? "cheapest" : ""}">
          <span class="store">${esc(chainName(o.lanac))}</span>
          <span class="what">${esc(o.naziv)}${item.upit && unitNote(o) ? ` · ${esc(unitNote(o))}` : ""} ${offerBadges(o)}${item.upit ? ` <button class="linkbtn small" data-act="exclude" data-id="${item.id}" data-code="${esc(o.kod)}" aria-label="Ne uzimaj ${esc(o.naziv)}">nije to</button>` : ""}</span>
          <span class="amt"><span class="num" style="font-weight:600">${esc(eur(o.ukupno))}</span>${o.redovna ? `<span class="old">${esc(eur(o.redovna * item.kom))}</span>` : o.kupon || o.popust ? `<span class="old">${esc(eur(o.bezKupona))}</span>` : ""}</span>
        </li>`).join("")}</ul>`;
      const missing = sel.filter((c) => !offers.some((o) => o.lanac === c));
      if (missing.length) h += `<p class="small muted">Nema u: ${missing.map(chainName).join(", ")}</p>`;
      if (item.upit) {
        if (item.pojmovi && item.pojmovi.length) h += `<p class="small muted">Traži se kao: ${termsOf(item).map(esc).join(", ")}</p>`;
        if (item.prihvaceni) {
          const known = new Set([...(item.prihvaceni || []), ...(item.odbijeni || [])]);
          const fresh = g.idx.filter((i) => (!g.strict.size || g.strict.has(i)) && !known.has(katalog.proizvodi[i][0])).length;
          const rejected = [...new Map((item.odbijeni || []).map((c) => [byCode.get(c)?.[1], c])).entries()].filter(([nm]) => nm);
          h += `<p class="small muted">Uspoređuje se ${new Set(item.prihvaceni.map((c) => byCode.get(c)?.[1])).size} provjerenih proizvoda.${fresh ? ` ${fresh} novih još nije provjereno.` : ""}</p>`;
          if (rejected.length) h += `<details class="alts"><summary class="small" style="cursor:pointer;font-weight:600">Isključeni pri provjeri (${rejected.length})</summary>${rejected.map(([nm, c]) =>
            `<div class="alt"><span class="grow">${esc(nm)}</span><button class="btn small ghost" data-act="accept" data-id="${item.id}" data-code="${esc(c)}">Vrati</button></div>`).join("")}</details>`;
        }
        h += `<p class="small muted">${ref ? `Uspoređuju se pakiranja od oko ${esc(qtyText(ref))}. ` : ""}Za drugo pakiranje dodaj količinu u naziv, npr. „${esc(queryWords(item.upit).join(" "))} ${ref && ref.dim === "kom" ? `${Math.max(2, Math.round(ref.v * 2))}/1` : ref && ref.dim === "ml" ? "1 l" : "500 g"}”. Ako aplikacija uzme krivi proizvod, dodirni „nije to”.</p>`;
        const skipped = item.iskljuceni || [];
        if (skipped.length) h += `<div class="alts"><div class="small" style="font-weight:600">Isključeni proizvodi</div>${skipped.map((k) => {
          const row = byCode.get(k);
          return `<div class="alt"><span class="grow">${esc(row ? row[1] : k)}</span><button class="btn small ghost" data-act="unexclude" data-id="${item.id}" data-code="${esc(k)}">Vrati</button></div>`;
        }).join("")}</div>`;
      } else {
        h += `<div class="alts"><div class="small" style="font-weight:600">Proizvodi u ovoj stavci</div>${item.kodovi.map((k) => {
          const row = byCode.get(k);
          return `<div class="alt"><span class="grow">${esc(row ? row[1] : "Proizvod više nije na cjenicima")}</span>${item.kodovi.length > 1 ? `<button class="btn small ghost" data-act="rm-alt" data-id="${item.id}" data-code="${esc(k)}" aria-label="Makni ${esc(row ? row[1] : k)}">Makni</button>` : ""}</div>`;
        }).join("")}</div>`;
      }
      h += `<div class="row" style="flex-wrap:wrap">
        ${item.upit ? (sample ? `<button class="btn small" data-act="reclassify" data-id="${item.id}" ${classifying ? "disabled" : ""}>Provjeri ponovno</button>` : "") : `<button class="btn small" data-act="alt" data-id="${item.id}">Dodaj zamjensku marku</button>`}
        <button class="btn small" data-act="rename" data-id="${item.id}">${item.upit ? "Promijeni" : "Preimenuj"}</button>
      </div>
      ${renaming === item.id ? `<form class="row" data-form="rename" data-id="${item.id}"><input id="rename-${item.id}" class="grow" style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)" value="${esc(item.upit || item.naziv)}" aria-label="${item.upit ? "Što tražiš" : "Novi naziv"}"><button class="btn small primary">Spremi</button></form>` : ""}`;
    }
    h += `</div>`;
    return h;
  }
  // Odabir proizvoda za opću stavku: sve što se nudi, po proizvođaču, s kvačicama.
  let picking = null;   // {id, sel: Set kodova}
  function brandOf(row) {
    if (katalog.marke && row[3] != null && katalog.marke[row[3]]) return katalog.marke[row[3]];
    const m = row[1].match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : row[1].split(/\s+/)[0];
  }
  function pickerRows(item) {
    const g = genericMatches(item);
    const selIdx = selectedChains().map(chainIndex);
    const rows = [];
    for (const i of g.idx) {
      const row = katalog.proizvodi[i];
      if (selIdx.some((ci) => row[2][ci] != null)) rows.push(row);
      if (rows.length >= 300) break;
    }
    return rows;
  }
  function pickerHtml(item) {
    const rows = pickerRows(item);
    if (!rows.length) return `<div class="picker"><p class="small">Nema proizvoda za „${esc(item.upit)}” u tvojim trgovinama. Probaj drukčiji naziv (dodirni Promijeni).</p></div>`;
    const groups = new Map();
    for (const row of rows) {
      const b = brandOf(row);
      if (!groups.has(b)) groups.set(b, []);
      groups.get(b).push(row);
    }
    const ordered = [...groups.entries()];  // redoslijed po najboljem pogotku u skupini
    return `<div class="picker" data-picker="${item.id}">
      <p class="small">Označi proizvode koji ti odgovaraju. Aplikacija će u svakoj trgovini birati najjeftiniji od označenih.</p>
      <input id="pick-filter" type="search" autocomplete="off" placeholder="Suzi popis, npr. length wonder" aria-label="Suzi popis proizvoda">
      ${ordered.map(([brand, list]) => `<div class="pgroup" data-group="${esc(brand)}">
        <div class="pgroup-head"><strong>${esc(brand)}</strong>
          <button class="linkbtn small" data-act="pick-group" data-on="1">označi sve</button>
          <button class="linkbtn small" data-act="pick-group" data-on="0">ništa</button></div>
        ${list.map((row) => {
          const best = cheapestSelected(row);
          return `<label class="prow" data-name="${esc(normText(row[1]))}"><input type="checkbox" data-pick="${esc(row[0])}" ${picking.sel.has(row[0]) ? "checked" : ""}>
            <span class="wraptext">${esc(row[1])}</span>
            <span class="pmeta">${best ? `od ${esc(eur(best.cijena))} · ${esc(chainName(best.lanac))}` : ""}</span></label>`;
        }).join("")}
      </div>`).join("")}
      <div class="picker-actions">
        <button class="btn primary" data-act="pick-save">Spremi odabir</button>
        <button class="btn" data-act="pick-all" data-on="0">Odznači sve</button>
        <button class="btn ghost" data-act="pick">Odustani</button>
      </div>
    </div>`;
  }
  function openPicker(item) {
    const allowed = allowedFilter(item);
    const g = genericMatches(item);
    const pos = new Map(g.idx.map((i) => [katalog.proizvodi[i][0], i]));
    // Početno označeno: ono što se sada uspoređuje.
    const sel = new Set(pickerRows(item).map((r) => r[0]).filter((c) => allowed(c, pos.get(c))));
    picking = { id: item.id, sel };
  }

  let renaming = null;
  let currentPlan = null;
  let openStore = null;   // trgovina čiji je popis otvoren u "Sve u jednoj trgovini"
  let classifying = null; // {ctl, text} dok Claude provjerava opće stavke
  let lastRemoved = null; // obrisane stavke, za "Vrati"
  let bulkText = "";

  function kuponiHtml() {
    const itemsOpts = state.stavke.map((s) => `<option value="${s.id}">${esc(s.naziv)}</option>`).join("");
    const chainOpts = chains().filter((c) => c.poslovnica > 0).map((c) => `<option value="${c.kod}">${esc(c.naziv)}</option>`).join("");
    let h = `<section class="section"><h2>Kuponi iz tvojih aplikacija</h2>
      <p class="muted small">Kuponi iz aplikacija trgovina (Lidl Plus, Kaufland Card, Moj Konzum…) nisu javni, pa ih ovdje dodaješ sam: sa snimke zaslona ili ručno. Kupon se uračuna čim je njegov proizvod na tvom popisu, sve dok ne istekne. Prije kupnje ga aktiviraj u aplikaciji trgovine.</p>`;
    if (sampleImages) {
      h += `<div class="card form">
        <h3>Učitaj snimku zaslona kupona</h3>
        <p class="small muted">Otvori kupone u aplikaciji trgovine, napravi snimku zaslona i odaberi je ovdje. Claude pročita kupone i pronađe njihove proizvode u cjeniku, a ti potvrdiš.</p>
        <div class="field"><label for="shot-chain">Trgovina na snimci</label><select id="shot-chain">${chainOpts}</select></div>
        <div class="field"><label for="shot">Snimke zaslona (možeš odabrati više njih ili jednu dugu snimku)</label><input id="shot" type="file" accept="image/*" multiple></div>
        ${readingCoupon ? `<div class="row"><span class="status">${readingCoupon.total > 1 ? `Čitam kupone, dio ${Math.min(readingCoupon.done + 1, readingCoupon.total)} od ${readingCoupon.total}…` : "Čitam kupone… ovo traje do pola minute."}</span><button class="btn small" data-act="stop-read">Zaustavi</button></div>` : ""}
      </div>`;
    }
    if (couponDraft) h += draftHtml();
    const rank = (k) => (couponActive(k) ? (couponOnList(k) ? 0 : 1) : 2);
    const list = state.kuponi.slice().sort((a, b) => rank(a) - rank(b) || String(a.vrijediDo || "9").localeCompare(String(b.vrijediDo || "9")));
    const expired = state.kuponi.filter((k) => !couponActive(k)).length;
    if (list.length) {
      h += `<div class="row"><h3 class="grow">Tvoji kuponi (${list.length})</h3>${expired ? `<button class="btn small ghost" data-act="del-expired">Obriši istekle (${expired})</button>` : ""}</div>
        <div class="section">${list.map(couponCardHtml).join("")}</div>`;
    }
    h += `<details class="card"${state.kuponi.length ? "" : " open"}><summary class="form" style="cursor:pointer"><h3 style="display:inline">Dodaj kupon ručno</h3></summary><form class="form" data-form="coupon" style="padding-top:0">
        ${state.stavke.length ? "" : `<p class="small muted">Prvo dodaj proizvode na popis.</p>`}
        <div class="two">
          <div class="field"><label for="k-lanac">Trgovina</label><select id="k-lanac" required>${chainOpts}</select></div>
          <div class="field"><label for="k-stavka">Proizvod s popisa</label><select id="k-stavka" required>${itemsOpts}</select></div>
        </div>
        <div class="two">
          <div class="field"><label for="k-vrsta">Vrsta kupona</label><select id="k-vrsta">
            <option value="posto">Popust u postotku</option>
            <option value="cijena">Posebna cijena</option>
            <option value="xy">Kupi X, plati Y</option>
            <option value="gratis">Gratis proizvod</option>
          </select></div>
          <div class="field" id="k-val-wrap"><label for="k-val">Popust (%)</label><input id="k-val" type="number" inputmode="decimal" min="1" max="100" step="1" value="50" required></div>
        </div>
        <div class="two" id="k-xy" hidden>
          <div class="field"><label for="k-x">Kupi (komada)</label><input id="k-x" type="number" min="2" step="1" value="2"></div>
          <div class="field"><label for="k-y">Plati (komada)</label><input id="k-y" type="number" min="1" step="1" value="1"></div>
        </div>
        <div class="field"><label for="k-do">Vrijedi do</label><input id="k-do" type="date" value="${nextSunday()}"></div>
        <label class="row small" for="k-povrat"><input id="k-povrat" type="checkbox"> Popust se vraća kao BONUS euri, a ne odbija na blagajni (npr. Konzumov „Kupon po tvom”)</label>
        <div><button class="btn primary" ${state.stavke.length ? "" : "disabled"}>Dodaj kupon</button></div>
      </form></details>`;
    h += `<div id="savestate-slot"></div></section>`;
    return h;
  }

  function couponCardHtml(k) {
    const active = couponActive(k);
    const item = state.stavke.find((s) => s.id === k.stavka);
    const idx = chainIndex(k.lanac);
    const products = (k.kodovi || []).map((c) => byCode.get(c)).filter(Boolean);
    const listed = couponOnList(k);
    const per = k.vrsta === "xy" ? k.x : 1;
    const prodHtml = products.map((r) => {
      const p = priceOf(r, idx);
      const after = p ? Math.round(totalWithCoupon(p.cijena, per, k) / per) : null;
      return `<div class="alt"><span class="grow">${esc(r[1])}</span>${p ? `<span class="num small"><span class="old">${esc(eur(p.cijena))}</span> <strong>${esc(eur(after))}</strong></span>` : `<span class="small muted">nema u cjeniku</span>`}</div>`;
    }).join("");
    const title = k.naziv || (item ? item.naziv : "") || k.opis || "";
    const until = !k.vrijediDo ? "Bez datuma isteka" : k.vrijediDo === todayIso() ? "Istječe danas" : `Vrijedi do ${fmtDate(k.vrijediDo)}`;
    return `<div class="coupon${active ? "" : " is-expired"}">
      <div class="row"><span class="coupon-value grow">${esc(couponLabel(k))}</span>${k.primjer ? `<span class="badge example">Primjer</span>` : ""}${!active ? `<span class="badge expired">Istekao</span>` : listed ? `<span class="badge onlist">Na popisu</span>` : ""}</div>
      <div><strong>${esc(chainName(k.lanac))}</strong> · ${esc(title)}</div>
      ${k.opis && k.opis !== title ? `<div class="small muted">${esc(k.opis)}</div>` : ""}
      ${k.povrat ? `<div class="small">Ne snižava cijenu na blagajni: iznos popusta vraća se kao BONUS euri.</div>` : ""}
      ${prodHtml ? `<div class="alts">${prodHtml}</div>` : item ? "" : `<div class="small muted">Nije povezan s proizvodom iz cjenika, pa se ne uračunava.</div>`}
      <div class="row" style="flex-wrap:wrap"><span class="small muted grow">${esc(until)}</span>
        ${active && products.length && !listed ? `<button class="btn small" data-act="coupon-add" data-id="${k.id}">Dodaj na popis</button>` : ""}
        <button class="btn small ghost danger" data-act="del-coupon" data-id="${k.id}">Obriši</button></div>
    </div>`;
  }

  function draftHtml() {
    const d = couponDraft;
    if (!d.length) return `<div class="notice"><p>Na snimci nisam našao kupone. Probaj snimku na kojoj se vide naziv proizvoda i popust.</p><div><button class="btn small" data-act="draft-cancel">U redu</button></div></div>`;
    const idx = chainIndex(d[0].lanac);
    return `<div class="card form"><h3>Pronađeni kuponi (${d.length})</h3>
      <p class="small muted">Provjeri je li svaki kupon dobro pročitan i povezan s pravim proizvodom iz cjenika. Kupon se uračuna kad taj proizvod staviš na popis.</p>
      ${d.map((k, i) => `<div class="coupon">
        <label class="row"><input type="checkbox" data-draft-on="${i}" ${k.on ? "checked" : ""}> <span class="coupon-value">${esc(couponLabel(k))}</span> <span class="grow wraptext">${esc(k.naziv)}</span>${k.postoji ? `<span class="badge example">Već spremljen</span>` : ""}</label>
        <div class="small">${esc(chainName(k.lanac))}${k.vrijediDo ? ` · do ${esc(fmtDate(k.vrijediDo))}` : ""}${k.povrat ? " · povrat u BONUS eurima" : ""}${k.opis ? ` · ${esc(k.opis)}` : ""}</div>
        <div class="field"><label for="draft-prod-${i}">Proizvod u cjeniku</label><select id="draft-prod-${i}" data-draft-prod="${i}">
          ${k.kandidati.map((c) => { const r = byCode.get(c); const p = r && priceOf(r, idx); return `<option value="${esc(c)}" ${c === k.odabran ? "selected" : ""}>${esc(r ? r[1] : c)}${p ? ` · ${esc(eur(p.cijena))}` : ""}</option>`; }).join("")}
          <option value="" ${k.odabran ? "" : "selected"}>Ne povezuj s proizvodom</option>
        </select></div>
      </div>`).join("")}
      <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="draft-save">Spremi označene kupone</button><button class="btn" data-act="draft-cancel">Odustani</button></div>
    </div>`;
  }

  function nextSunday() {
    const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function trgovineHtml() {
    const sel = selectedChains();
    const cityOpts = (katalog.gradovi || []).map(([g, n]) => `<option value="${esc(g)}" ${g === state.grad ? "selected" : ""}>${esc(g)} (${n} ${plural(n, "trgovina", "trgovine", "trgovina")})</option>`).join("");
    return `<section class="section"><h2>Moje trgovine</h2>
      <p class="muted small">Označi trgovine u kojima kupuješ ili čije aplikacije imaš. Usporedba gleda samo njih.</p>
      <ul class="card stores">${chains().map((c) => {
        const card = (cardPrices.get(c.kod) || []).find((src) => !src.svi);
        return `<li><label>
        <input type="checkbox" data-chain="${c.kod}" ${sel.includes(c.kod) ? "checked" : ""} ${c.poslovnica ? "" : "disabled"}>
        <span class="grow"><strong>${esc(c.naziv)}</strong><br><span class="small muted">${c.poslovnica ? `${c.poslovnica} ${plural(c.poslovnica, "poslovnica", "poslovnice", "poslovnica")} · ${(c.proizvoda || 0).toLocaleString("hr-HR")} proizvoda` : "Nema cjenika"}${c.cijelaHrvatska ? `<br>U gradu ${esc(katalog.grad)} nema poslovnica u cjenicima, pa su prikazane najčešće cijene u Hrvatskoj.` : ""}${c.zamjenskiGradovi ? `<br>U gradu ${esc(katalog.grad)} nema poslovnica u cjenicima, pa su prikazane cijene iz najbližih: ${esc(c.zamjenskiGradovi.join(", "))}.` : ""}</span></span>
      </label>${card && sel.includes(c.kod) ? `<div class="cardrow"><label>
        <input type="checkbox" data-card="${c.kod}" ${hasCard(c.kod) ? "checked" : ""}>
        <span>Imam ${esc(card.naziv)} <span class="muted">· ${card.cijene.size.toLocaleString("hr-HR")} nižih cijena uz karticu${[...card.cijene.values()].some((p) => p.some((x) => x[3] === "kupon")) ? ", dio njih treba aktivirati kao kupon u aplikaciji" : ""}</span></span>
      </label></div>` : ""}</li>`;
      }).join("")}</ul>
      <h2>Zajednički popis</h2>
      <div class="notice small">
        <p>Popis može upisivati više ljudi, svatko sa svog mobitela, a promjene se vide odmah.</p>
        <ol style="margin:0;padding-left:18px;display:grid;gap:4px">
          <li>Otvori izbornik za dijeljenje ove aplikacije (<strong>Share</strong>).</li>
          <li>Pozovi ukućane njihovom e-mail adresom, s pravom uređivanja (<strong>Editor</strong>).</li>
          <li>Ne uključuj javnu poveznicu: dok je uključena, pozvani mogu samo gledati.</li>
        </ol>
        <p class="muted">Svatko treba Claude račun. Trgovine, grad, kartice i kuponi su zajednički za sve na popisu.</p>

  function addGeneric(text) {
    const upit = String(text || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (upit.length < 2 || state.stavke.some((s) => s.upit && fold(s.upit) === fold(upit))) return null;
    const item = newItem({ naziv: upit[0].toUpperCase() + upit.slice(1), upit, iskljuceni: [] });
    state.stavke.push(item);
    return item;
  }

  // Claude provjeri opće stavke: što je kupac mislio, kako se to zove u cjenicima i koji proizvodi odgovaraju.
  async function classify(items) {
    items = items.filter((it) => it && it.upit);
    if (!sample || !items.length || classifying) return;
    const ctl = new AbortController();
    classifying = { ctl, text: "Provjeravam što si mislio…" };

    try {
      const list = items.map((it, n) => `${n + 1}. "${it.upit}"`).join("\n");
      const a = await sample.json(`Kupac u Hrvatskoj je na popis za kupnju upisao ove stavke:
${list}

Za svaku stavku napiši što kupac najvjerojatnije želi kupiti (najčešće svakodnevno značenje) i kako se ta vrsta proizvoda zove u nazivima proizvoda u cjenicima hrvatskih trgovina (Konzum, Lidl, Kaufland, Spar, Plodine, Studenac, Eurospin).
Vrati SAMO JSON polje: [{"stavka": broj, "znacenje": "kratko, npr. papirnati kuhinjski ubrusi u rolama", "pojmovi": ["2 do 5 kratkih pojmova za pretraživanje naziva"]}]
Pravila za pojmove:
- Riječi kakve stoje u nazivima proizvoda, npr. za "ubrus": "ubrus", "papirnati ručnik", "kuhinjski ručnik", "kuhinjski papir".
- Strane nazive prevedi na hrvatske koji se koriste u trgovinama (npr. "conditioner" je "regenerator", "shampoo" je "šampon"), a ime marke i linije proizvoda zadrži (npr. "nivea regenerator length wonder").
- Ako je kupac upisao marku, okus ili količinu, stavi ih u svaki pojam (npr. "čajna kobasica gavrilović").
- Bez riječi koje se ne pišu u nazivima proizvoda (npr. "jeftini", "dobar").`, { modelTier: "quick", signal: ctl.signal });
      for (const r of Array.isArray(a) ? a : []) {
        const it = items[(r && r.stavka) - 1];
